<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Фикус</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Фикус">
<meta name="theme-color" content="#f4f1f7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0b0a10" media="(prefers-color-scheme: dark)">
<!-- тема «он» включается до первой отрисовки, иначе полсекунды мигает розовая -->
<script>
// 15 цветов фона на выбор: [оттенок, насыщенность, название]
var LOOK_COLORS=[[340,85,'Розовый'],[5,80,'Красный'],[18,85,'Коралловый'],[32,90,'Оранжевый'],[48,90,'Жёлтый'],[80,70,'Лайм'],[130,55,'Зелёный'],[160,60,'Мятный'],[180,65,'Бирюзовый'],[200,80,'Голубой'],[222,75,'Синий'],[245,65,'Индиго'],[270,65,'Фиолетовый'],[295,55,'Сиреневый'],[0,0,'Графит']];
function lookVars(look){var r=document.documentElement,c=(look&&look.c)||[];
  if(look&&look.mode&&look.mode!=='auto')r.setAttribute('data-mode',look.mode);else r.removeAttribute('data-mode');
  if(c.length){r.setAttribute('data-look','1');for(var i=0;i<3;i++){var k=LOOK_COLORS[c[i%c.length]]||LOOK_COLORS[0];r.style.setProperty('--h'+(i+1),k[0]);r.style.setProperty('--s'+(i+1),k[1]+'%');}}else r.removeAttribute('data-look');}
try{var d=JSON.parse(localStorage.getItem('kadr.v1'));if(d&&d.profile&&d.profile.gender==='m')document.documentElement.setAttribute('data-g','m');lookVars(d&&d.settings&&d.settings.look);}catch(e){}
</script>
<meta name="format-detection" content="telephone=no">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<style>
/* Layout: одна колонка как в iOS-приложении — крупный заголовок, стеклянные карточки поверх цветного фона, плавающий таб-бар внизу */
:root{
  --base:#f4f1f7;
  --blob1:#ffc2d4; --blob2:#cfc6ff; --blob3:#ffd9b8;
  --fg:#1c1c1e; --fg2:rgba(60,60,67,.64); --fg3:rgba(60,60,67,.34);
  --glass:rgba(255,255,255,.52); --glass-strong:rgba(255,255,255,.78);
  --edge:rgba(255,255,255,.75); --hi:rgba(255,255,255,.95);
  --shadow:rgba(90,40,100,.13); --sep:rgba(60,60,67,.13); --fill:rgba(118,118,128,.12);
  --pink:#ff2d55; --teal:#12a4bb; --orange:#ff9500; --indigo:#5856d6;
  --green:#28b14c; --red:#ff3b30; --gray:#8e8e93;
  --accent:var(--pink); --on-accent:#fff; --on-grad:#fff;
  --grad:linear-gradient(135deg,var(--pink),var(--indigo)); --grad-warm:linear-gradient(135deg,var(--pink),var(--orange));
  --ring1:var(--pink); --ring2:var(--orange);
  --splash:radial-gradient(120% 80% at 20% 10%,#ff5e80 0%,transparent 55%),radial-gradient(100% 70% at 90% 90%,#7652e6 0%,transparent 60%),#2a1638;
  --sans:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --display:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",Roboto,sans-serif;
  --rounded:ui-rounded,"SF Pro Rounded",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  --r-card:26px; --r-row:18px;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root{
    --base:#0b0a10;
    --blob1:#7a1844; --blob2:#2e2590; --blob3:#6a340d;
    --fg:#fff; --fg2:rgba(235,235,245,.62); --fg3:rgba(235,235,245,.3);
    --glass:rgba(38,34,48,.46); --glass-strong:rgba(44,40,56,.82);
    --edge:rgba(255,255,255,.13); --hi:rgba(255,255,255,.22);
    --shadow:rgba(0,0,0,.45); --sep:rgba(84,84,88,.5); --fill:rgba(118,118,128,.24);
    --pink:#ff375f; --teal:#40c8e0; --orange:#ff9f0a; --indigo:#7d7aff;
    --green:#30d158; --red:#ff453a; --gray:#98989d;
    color-scheme:dark;
  }
}
/* мужская тема: всегда тёмная, акцент — кислотно-зелёный; цвета типов записей не меняются */
:root[data-g="m"]{
  --base:#07090a;
  --blob1:#1d4a14; --blob2:#0c2a2a; --blob3:#2b3a0c;
  --fg:#fff; --fg2:rgba(232,240,232,.62); --fg3:rgba(232,240,232,.3);
  --glass:rgba(28,34,30,.5); --glass-strong:rgba(22,27,24,.88);
  --edge:rgba(255,255,255,.12); --hi:rgba(255,255,255,.16);
  --shadow:rgba(0,0,0,.55); --sep:rgba(84,92,86,.5); --fill:rgba(118,130,120,.22);
  --pink:#ff375f; --teal:#40c8e0; --orange:#ff9f0a; --indigo:#7d7aff;
  --green:#30d158; --red:#ff453a; --gray:#98989d;
  --accent:#b6ff3c; --on-accent:#0b1405; --on-grad:#0b1405;
  --grad:linear-gradient(135deg,#b6ff3c,#22d3a6); --grad-warm:linear-gradient(135deg,#d4ff3c,#5ef08a);
  --ring1:#b6ff3c; --ring2:#22d3a6;
  --splash:radial-gradient(120% 80% at 20% 10%,#2d6a12 0%,transparent 55%),radial-gradient(100% 70% at 90% 90%,#0d4a44 0%,transparent 60%),#050807;
  color-scheme:dark;
}
/* своё оформление (Меню → Оформление): режим фона и до трёх цветов пятен; режим главнее темы пола */
:root{--bl:80%}
@media (prefers-color-scheme: dark){:root{--bl:30%}}
:root[data-g="m"]{--bl:24%}
:root[data-mode="light"]{
  --base:#f4f1f7; --bl:80%;
  --fg:#1c1c1e; --fg2:rgba(60,60,67,.64); --fg3:rgba(60,60,67,.34);
  --glass:rgba(255,255,255,.52); --glass-strong:rgba(255,255,255,.78);
  --edge:rgba(255,255,255,.75); --hi:rgba(255,255,255,.95);
  --shadow:rgba(90,40,100,.13); --sep:rgba(60,60,67,.13); --fill:rgba(118,118,128,.12);
  --pink:#ff2d55; --teal:#12a4bb; --orange:#ff9500; --indigo:#5856d6; --green:#28b14c; --red:#ff3b30; --gray:#8e8e93;
  color-scheme:light;
}
:root[data-g="m"][data-mode="light"]{--accent:#3d9b00; --on-accent:#fff}
:root[data-mode="dark"],:root[data-mode="black"]{
  --base:#0b0a10; --bl:30%;
  --fg:#fff; --fg2:rgba(235,235,245,.62); --fg3:rgba(235,235,245,.3);
  --glass:rgba(38,34,48,.46); --glass-strong:rgba(44,40,56,.82);
  --edge:rgba(255,255,255,.13); --hi:rgba(255,255,255,.22);
  --shadow:rgba(0,0,0,.45); --sep:rgba(84,84,88,.5); --fill:rgba(118,118,128,.24);
  --pink:#ff375f; --teal:#40c8e0; --orange:#ff9f0a; --indigo:#7d7aff; --green:#30d158; --red:#ff453a; --gray:#98989d;
  color-scheme:dark;
}
:root[data-mode="black"]{--base:#000; --bl:16%; --glass:rgba(28,28,30,.55); --glass-strong:rgba(28,28,30,.9); --edge:rgba(255,255,255,.1)}
:root[data-mode="black"] .bg i{opacity:.6}
:root[data-look] .bg i:nth-child(1){background:hsl(var(--h1) var(--s1) var(--bl))}
:root[data-look] .bg i:nth-child(2){background:hsl(var(--h2) var(--s2) var(--bl))}
:root[data-look] .bg i:nth-child(3){background:hsl(var(--h3) var(--s3) var(--bl))}
:root{--b1:var(--blob1);--b2:var(--blob2);--b3:var(--blob3)}
:root[data-look]{--b1:hsl(var(--h1) var(--s1) var(--bl));--b2:hsl(var(--h2) var(--s2) var(--bl));--b3:hsl(var(--h3) var(--s3) var(--bl))}
/* мини-экран: как будет выглядеть приложение — меняется вместе с выбором */
.lp{position:relative;height:210px;border-radius:24px;overflow:hidden;background:var(--base);border:1px solid var(--edge);margin-bottom:16px;transition:background .4s}
.lp>i{position:absolute;border-radius:50%;filter:blur(26px);opacity:.9;transition:background .4s}
.lp>i:nth-child(1){width:70%;height:80%;left:-20%;top:-25%;background:var(--b1)}
.lp>i:nth-child(2){width:65%;height:75%;right:-20%;top:20%;background:var(--b2)}
.lp>i:nth-child(3){width:60%;height:70%;left:5%;bottom:-40%;background:var(--b3)}
:root[data-mode="black"] .lp>i{opacity:.6}
.lp-in{position:relative;height:100%;padding:14px;display:flex;flex-direction:column;gap:8px;text-align:left}
.lp-h{display:flex;justify-content:space-between;align-items:center}.lp-h b{font:700 19px var(--display);color:var(--fg)}
.lp-h span{width:24px;height:24px;border-radius:50%;background:var(--accent)}
.lp-row{display:flex;gap:8px}.lp-c{flex:1;height:42px;border-radius:12px;background:var(--glass);border:1px solid var(--edge)}
.lp-w{flex:none;height:auto;padding:10px;display:flex;flex-direction:column;gap:6px}
.lp-w em{display:block;height:7px;border-radius:4px;background:var(--fg3);width:72%}.lp-w em+em{width:45%}
.lp-dock{margin-top:auto;align-self:center;display:flex;align-items:center;gap:16px;padding:6px 16px;border-radius:999px;background:var(--glass);border:1px solid var(--edge)}
.lp-dock span{width:14px;height:14px;border-radius:5px;background:var(--fg3)}.lp-dock .a{width:24px;height:24px;border-radius:50%;background:var(--accent)}
.onb .swatches{gap:10px;padding:12px}
.ava.photo{background-size:cover!important;background-position:center!important;color:transparent}
.ava-pick{display:flex;align-items:center;gap:14px;margin:0 6px 16px}.ava-pick .ava{width:64px;height:64px;font-size:22px}
/* свайп строки, как в Telegram: влево — действия, вправо — сделано */
.row.swipe{transition:transform .25s cubic-bezier(.2,.9,.25,1)}
.row.dragging{transition:none}
.swacts{position:absolute;top:0;bottom:0;left:100%;width:216px;display:flex;align-items:center;justify-content:space-around;padding:0 6px}
.swacts button{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11px;font-weight:500;color:var(--fg2)}
.swacts i,.swdone i{display:grid;place-items:center;width:58px;height:38px;border-radius:19px;color:#fff}
.swacts svg,.swdone svg{width:21px;height:21px}
.swacts .s-pin i{background:var(--indigo)}.swacts .s-mute i{background:var(--orange)}.swacts .s-del i{background:var(--red)}
.swdone{position:absolute;top:0;bottom:0;right:100%;width:110px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:11px;font-weight:500;color:var(--fg2)}
.swdone i{background:var(--green)}
.swatches{display:grid;grid-template-columns:repeat(5,1fr);gap:14px;padding:16px;margin-bottom:12px}
.swatch{position:relative;aspect-ratio:1;border-radius:50%;box-shadow:inset 0 0 0 1px rgba(0,0,0,.08);transition:transform .2s}
.swatch.on{transform:scale(.88);box-shadow:0 0 0 3px var(--base),0 0 0 5px var(--fg)}
.swatch b{position:absolute;inset:0;display:grid;place-items:center;color:#fff;font-size:15px;text-shadow:0 1px 3px rgba(0,0,0,.4)}
.bg i{transition:background .6s ease}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;background:var(--base);color:var(--fg)}
body{font:17px/1.35 var(--sans);-webkit-font-smoothing:antialiased;touch-action:manipulation;overscroll-behavior-y:none}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
input,select,textarea{font:inherit;color:inherit}
a{color:inherit;text-decoration:none}
[hidden]{display:none!important}
.num{font-variant-numeric:tabular-nums}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* живой фон, чтобы стеклу было что преломлять */
.bg{position:fixed;inset:0;z-index:0;overflow:hidden;background:var(--base)}
/* iPhone (с экрана «Домой»): на короткой странице фон не доходил до низа — снизу чёрная полоса.
   Фон — на всю «большую» высоту экрана, а страница всегда не короче экрана */
@supports (height:100lvh){.bg{bottom:auto;height:calc(100lvh + env(safe-area-inset-bottom,0px))}}
.app{position:relative;z-index:1;min-height:100vh;min-height:100lvh}
.bg i{position:absolute;border-radius:50%;filter:blur(60px);opacity:.85;animation:drift 22s ease-in-out infinite alternate}
.bg i:nth-child(1){width:70vmax;height:70vmax;background:var(--blob1);left:-25vmax;top:-20vmax}
.bg i:nth-child(2){width:60vmax;height:60vmax;background:var(--blob2);right:-25vmax;top:25vh;animation-duration:28s}
.bg i:nth-child(3){width:55vmax;height:55vmax;background:var(--blob3);left:-10vmax;bottom:-30vmax;animation-duration:32s}
@keyframes drift{to{transform:translate(6vmax,4vmax) scale(1.08)}}

/* Liquid Glass */
.glass{
  position:relative;background:var(--glass);
  -webkit-backdrop-filter:blur(26px) saturate(185%);backdrop-filter:blur(26px) saturate(185%);
  border:1px solid var(--edge);
  box-shadow:inset 0 1px 0 var(--hi),inset 0 -1px 0 rgba(255,255,255,.08),0 10px 34px -10px var(--shadow);
}
.glass::before{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;
  background:linear-gradient(160deg,rgba(255,255,255,.35),rgba(255,255,255,0) 38%,rgba(255,255,255,0) 70%,rgba(255,255,255,.12));mix-blend-mode:soft-light}

.app{max-width:560px;margin:0 auto;padding:calc(env(safe-area-inset-top,0px) + 10px) 16px calc(env(safe-area-inset-bottom,0px) + 120px)}

/* шапка */
.top{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;padding-top:6px}
.top h1{font:700 34px/1.1 var(--display);letter-spacing:-.02em;margin:0;text-wrap:balance}
.hello{font-size:15px;color:var(--fg2);font-weight:500;margin-bottom:2px}
.circle{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;flex:none}
.me-btn{flex:none;border-radius:50%;box-shadow:0 6px 16px -6px var(--shadow);transition:transform .2s}
.me-btn .ava{width:42px;height:42px;font-size:15px;border:2px solid var(--edge)}
.me-btn:active{transform:scale(.92)}
/* появление экрана при смене вкладки */
.view-in > *{animation:viewIn .38s cubic-bezier(.2,.9,.25,1) both}
.view-in > *:nth-child(2){animation-delay:.03s}
.view-in > *:nth-child(3){animation-delay:.06s}
@keyframes viewIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.circle svg{width:22px;height:22px}
.month{display:flex;align-items:center;justify-content:space-between;margin:16px 0 14px;border-radius:999px;padding:4px}
.month button{width:40px;height:40px;border-radius:50%;display:grid;place-items:center}
.month button:active{background:var(--fill)}
.month svg{width:18px;height:18px}
.month .ml{font-weight:600;font-size:17px;text-transform:capitalize}

.stack{display:flex;flex-direction:column;gap:14px}
.card{border-radius:var(--r-card);padding:18px}
.card h2{font:600 13px/1.2 var(--sans);text-transform:uppercase;letter-spacing:.06em;color:var(--fg2);margin:0 0 12px}
.section-title{font:700 20px/1.2 var(--display);margin:10px 4px -4px;letter-spacing:-.01em}
.section-note{font-size:14px;color:var(--fg2);margin:-8px 4px -2px}

/* фраза дня */
.phrase{display:flex;gap:12px;align-items:center;text-align:left;width:100%}
.phrase .spark{width:38px;height:38px;border-radius:12px;flex:none;display:grid;place-items:center;color:var(--on-grad);background:var(--grad)}
.phrase .spark svg{width:20px;height:20px}
.phrase p{margin:0;font-weight:600;font-size:17px;line-height:1.3}
.phrase small{display:block;color:var(--fg2);font-size:13px;font-weight:400;margin-top:2px}

/* чипы-фильтры */
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin:0 -16px;padding:2px 16px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;padding:8px 14px;border-radius:999px;font-size:15px;font-weight:500}
.chip[aria-pressed="true"]{background:var(--fg);color:var(--base);border-color:transparent}
.chip[aria-pressed="true"]::before{display:none}

/* строки списка */
.list{border-radius:var(--r-card);padding:6px 0;overflow:hidden}
.row{display:flex;align-items:center;gap:12px;padding:10px 16px;min-height:62px;width:100%;text-align:left;position:relative}
.row+.row::after{content:"";position:absolute;top:0;left:66px;right:0;height:1px;background:var(--sep)}
.row:active{background:var(--fill)}
.ic{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;flex:none;color:#fff;background:var(--c)}
.ic svg{width:21px;height:21px}
.ic .emo{font-size:21px;line-height:1}
.ic:has(.emo){background:color-mix(in srgb,var(--c) 22%,var(--glass-strong))}
.prio-e{margin-right:5px}
/* разделы меню «+» */
.add-secs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.add-sec{display:flex;flex-direction:column;align-items:center;gap:4px;padding:12px 6px;border-radius:18px;background:var(--glass);border:1px solid var(--edge);font-size:14px;font-weight:600;color:var(--fg2);transition:all .2s}
.add-sec span{font-size:24px;line-height:1}
.add-sec.on{background:color-mix(in srgb,var(--accent) 16%,var(--glass-strong));border-color:color-mix(in srgb,var(--accent) 45%,transparent);color:var(--fg)}
.add-sec:active{transform:scale(.96)}
.home-date{font-size:15px;font-weight:600;color:var(--fg2);margin:-6px 4px 0}
.stat{text-align:left;width:100%}
/* выбор приоритета и иконки в форме */
.prio-seg span{font-size:15px;padding:6px 0}
.field .prio-seg label{width:auto;flex:1;font-size:inherit;color:inherit}
.emoji-grid{display:grid;grid-template-columns:repeat(8,1fr);gap:6px;padding:10px 12px 12px}
.emoji-grid button{font-size:22px;line-height:1;padding:7px 0;border-radius:10px}
.emoji-grid button.on{background:color-mix(in srgb,var(--accent) 20%,transparent);box-shadow:inset 0 0 0 2px var(--accent)}
.icon-pick{display:flex;align-items:center;gap:10px;width:100%;text-align:left}
.icon-pick .cur{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;font-size:20px;background:var(--fill);margin-left:auto}
.icon-pick .cur svg{width:20px;height:20px}
.sheet-head .mini{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:var(--fill);margin-left:auto}
.sheet-head .mini + .circle{margin-left:8px}
.row[style*="--pc"]{box-shadow:inset 3px 0 0 var(--pc)}
/* блоки приоритетов под календарём */
.prio-h{display:flex;align-items:center;gap:6px;margin:6px 6px -6px;font-size:14px;font-weight:700;color:var(--pc)}
.ava{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;flex:none;color:#fff;font:700 15px var(--rounded);background:linear-gradient(135deg,hsl(var(--h) 80% 62%),hsl(calc(var(--h) + 50) 70% 52%))}
.rt{flex:1;min-width:0}
.t1{font-weight:600;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.t2{font-size:14px;color:var(--fg2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rr{display:flex;flex-direction:column;align-items:flex-end;gap:4px;flex:none}
.amt{font:600 16px var(--rounded);font-variant-numeric:tabular-nums}
.amt.neg{color:var(--red)}
.pill{font-size:12px;font-weight:600;padding:3px 9px;border-radius:999px;white-space:nowrap}
.pill.ok{color:var(--green);background:color-mix(in srgb,var(--green) 15%,transparent)}
.pill.wait{color:var(--orange);background:color-mix(in srgb,var(--orange) 16%,transparent)}
.pill.part{color:var(--teal);background:color-mix(in srgb,var(--teal) 15%,transparent)}
.pill.sub{color:var(--indigo);background:color-mix(in srgb,var(--indigo) 15%,transparent)}
.pill.late{color:var(--red);background:color-mix(in srgb,var(--red) 14%,transparent)}
/* светлая тема: цветной текст на бледной плашке читался плохо — темнее */
@media (prefers-color-scheme: light){:root:not([data-g="m"]):not([data-mode="dark"]):not([data-mode="black"]) .pill.wait{color:#9a4a00}:root:not([data-g="m"]):not([data-mode="dark"]):not([data-mode="black"]) .pill.part{color:#06606e}:root:not([data-g="m"]):not([data-mode="dark"]):not([data-mode="black"]) .pill.late{color:#b3261e}}
:root[data-mode="light"] .pill.wait{color:#9a4a00}:root[data-mode="light"] .pill.part{color:#06606e}:root[data-mode="light"] .pill.late{color:#b3261e}
.check{width:28px;height:28px;border-radius:50%;border:2px solid var(--fg3);display:grid;place-items:center;flex:none}
.check svg{width:16px;height:16px;opacity:0}
.check.on{background:var(--green);border-color:var(--green);color:#fff}
.check.on svg{opacity:1}
.row.past .t1,.row.past .amt{opacity:.55}
.row.doneRow .t1{text-decoration:line-through;opacity:.5}
.day{display:flex;justify-content:space-between;align-items:baseline;margin:6px 6px -6px;font-size:15px;font-weight:600;color:var(--fg2)}
.day.today{color:var(--accent)}
.day span:last-child{font-weight:500;font-size:14px}

.empty{text-align:center;padding:30px 20px}
.empty .big{width:64px;height:64px;border-radius:20px;margin:0 auto 12px;display:grid;place-items:center;color:var(--on-grad);background:var(--grad)}
.empty .big svg{width:32px;height:32px}
.empty b{display:block;font-size:18px;margin-bottom:4px}
.empty p{margin:0 auto;color:var(--fg2);font-size:15px;max-width:30ch}

/* деньги */
.hero{display:flex;gap:16px;align-items:center}
.hero .k{flex:1;min-width:0}
.label{font-size:14px;color:var(--fg2);font-weight:500}
.money{font:700 38px/1.1 var(--rounded);letter-spacing:-.02em;font-variant-numeric:tabular-nums;margin:2px 0 10px;white-space:nowrap}
.money.neg{color:var(--red)}
.mini{display:flex;gap:16px;flex-wrap:wrap;font-size:14px;color:var(--fg2)}
.mini b{display:block;color:var(--fg);font:600 17px var(--rounded);font-variant-numeric:tabular-nums}
/* «Получено / Расходы» во всю ширину карточки, под каждым — что ещё впереди */
.money2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);margin-top:16px;padding-top:14px;border-top:1px solid var(--sep)}
.money2>div{min-width:0;padding-right:12px}.money2>div+div{padding:0 0 0 14px;border-left:1px solid var(--sep)}
.money2 .l{font-size:13px;color:var(--fg2)}
.money2 b{display:block;font:600 clamp(16px,5vw,20px) var(--rounded);font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin:2px 0 4px}
.money2 small{display:block;font-size:13px;color:var(--fg2);line-height:1.3}
.money2 small i{font-style:normal;font-variant-numeric:tabular-nums;color:var(--fg);white-space:nowrap}
.ring{width:108px;height:108px;flex:none;position:relative;display:grid;place-items:center}
.ring svg{position:absolute;inset:0;transform:rotate(-90deg)}
.ring .pct{font:700 20px var(--rounded);text-align:center;line-height:1.05}
.ring .pct small{display:block;font:500 11px var(--sans);color:var(--fg2)}
.bar{display:flex;height:12px;border-radius:999px;overflow:hidden;background:var(--fill);margin-bottom:14px}
.bar i{display:block;height:100%}
.legend{display:flex;flex-direction:column;gap:10px}
.lg{display:flex;align-items:center;gap:10px;font-size:15px}
.lg .dot{width:10px;height:10px;border-radius:50%;flex:none}
.lg .n{flex:1}
.lg .p{color:var(--fg2);font-size:13px;width:42px;text-align:right}
.lg .v{font:600 15px var(--rounded);font-variant-numeric:tabular-nums;min-width:90px;text-align:right}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:14px;border-radius:16px;font-weight:600;font-size:17px}
.btn.primary{background:var(--accent);color:var(--on-accent);box-shadow:0 8px 22px -8px var(--accent)}
.btn.tinted{background:color-mix(in srgb,var(--accent) 14%,transparent);color:var(--accent)}
.btn.danger{color:var(--red);background:color-mix(in srgb,var(--red) 12%,transparent)}
.btn svg{width:20px;height:20px}
.btn:active{transform:scale(.98)}
.btn-row{display:flex;gap:10px}
.btn-row .btn{flex:1;font-size:15px;padding:12px 8px}

/* история */
.chart{width:100%;overflow:hidden}
.chart svg{display:block;width:100%}
.chart text{fill:var(--fg2);font:500 11px var(--sans)}
.chart .grid{stroke:var(--sep)}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.stat .label{font-size:13px}
.stat b{display:block;font:700 22px var(--rounded);font-variant-numeric:tabular-nums;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stat span{font-size:13px;color:var(--fg2)}

/* клиенты */
.search{display:flex;align-items:center;gap:8px;border-radius:14px;padding:0 12px;background:var(--fill)}
.search svg{width:18px;height:18px;color:var(--fg2);flex:none}
.search input{flex:1;border:0;background:none;padding:11px 0;font-size:17px;outline:none;min-width:0}
.search input::placeholder{color:var(--fg2)}
.profile{text-align:center;margin-bottom:16px}
.profile .ava{width:76px;height:76px;font-size:28px;margin:0 auto 10px}
.profile h4{margin:0;font:700 24px var(--display)}
.profile p{margin:4px 0 0;color:var(--fg2);font-size:15px}
.contacts{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:14px}
.contact{display:flex;flex-direction:column;align-items:center;gap:4px;min-width:74px;padding:10px 8px;border-radius:16px;background:var(--fill);font-size:12px;font-weight:600;color:var(--accent)}
.contact svg{width:22px;height:22px}
.dots{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0 2px}
.dots i{width:14px;height:14px;border-radius:50%;background:var(--fill);border:2px solid var(--indigo)}
.dots i.on{background:var(--indigo)}
.subcard{border-radius:18px;background:var(--glass);border:1px solid var(--edge);padding:14px 16px;text-align:left;width:100%;display:block}
.subcard .t1{display:flex;justify-content:space-between;gap:8px}
.subcard + .subcard{margin-top:10px}

/* календарь */
.seg.glass-seg{margin:0;background:var(--glass);border:1px solid var(--edge);-webkit-backdrop-filter:blur(26px) saturate(185%);backdrop-filter:blur(26px) saturate(185%);border-radius:14px}
.calhead{display:flex;align-items:center;gap:8px;margin-top:2px}
.calhead h2{flex:1;min-width:0;margin:0;font:700 20px/1.2 var(--display);letter-spacing:-.01em;text-transform:none;color:var(--fg)}
.calhead h2::first-letter{text-transform:uppercase}
.calhead .nav{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;flex:none}
.calhead .nav svg{width:16px;height:16px}
.today-btn{padding:7px 12px;border-radius:999px;font-weight:600;font-size:14px;color:var(--accent);background:color-mix(in srgb,var(--accent) 12%,transparent);flex:none}
.strip{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;padding:8px 6px;border-radius:22px}
.strip button{display:flex;flex-direction:column;align-items:center;gap:3px;padding:4px 0;font-size:11px;font-weight:600;color:var(--fg2);text-transform:uppercase}
.strip b{font:600 17px var(--rounded);color:var(--fg);width:36px;height:36px;display:grid;place-items:center;border-radius:50%}
.strip .today b{color:var(--accent)}
.strip .sel b{background:var(--fg);color:var(--base)}
.strip .sel.today b{background:var(--accent);color:var(--on-accent)}
.strip i{width:5px;height:5px;border-radius:50%;background:var(--fg3)}
.allday{display:flex;flex-direction:column;gap:6px}
.chipev{display:block;width:100%;text-align:left;padding:8px 12px;border-radius:12px;font-size:14px;font-weight:600;line-height:1.3;
  background:color-mix(in srgb,var(--c) 18%,var(--glass-strong));box-shadow:inset 3px 0 0 var(--c);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chipev span{font-weight:400;color:var(--fg2)}
.chipev.done{opacity:.55;text-decoration:line-through}
.tl{position:relative;border-radius:22px;overflow:hidden;cursor:copy}
.tl .hr{position:absolute;left:52px;right:0;height:1px;background:var(--sep)}
.tl .hl{position:absolute;left:10px;font:500 11px var(--sans);color:var(--fg2);transform:translateY(-50%);font-variant-numeric:tabular-nums}
.tl .now{position:absolute;left:48px;right:0;height:2px;background:var(--red);z-index:2;pointer-events:none}
.tl .now::before{content:"";position:absolute;left:-4px;top:-4px;width:10px;height:10px;border-radius:50%;background:var(--red)}
.ev{position:absolute;z-index:1;border-radius:10px;padding:5px 8px;overflow:hidden;text-align:left;font-size:13px;line-height:1.25;cursor:pointer;
  display:flex;flex-direction:column;justify-content:flex-start;align-items:stretch;
  background:color-mix(in srgb,var(--c) 22%,var(--glass-strong));box-shadow:inset 3px 0 0 var(--c),0 2px 8px -4px var(--shadow)}
.ev b{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ev span{display:block;color:var(--fg2);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ev.short{padding:3px 8px;flex-direction:row;gap:6px;align-items:baseline}
.ev.short span{flex:none}
.week{padding:0}
.wrow{display:flex;gap:12px;padding:10px 14px;align-items:flex-start;position:relative;min-height:60px}
.wrow+.wrow::after{content:"";position:absolute;top:0;left:14px;right:0;height:1px;background:var(--sep)}
.wdate{width:42px;flex:none;text-align:center;border-radius:12px;padding:2px 0}
.wdate small{display:block;font-size:11px;font-weight:600;color:var(--fg2);text-transform:uppercase}
.wdate b{font:700 21px/1.1 var(--rounded)}
.wrow.today .wdate small,.wrow.today .wdate b{color:var(--accent)}
.wev{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px;padding-top:2px}
.wev .free{color:var(--fg3);font-size:15px;text-align:left;padding:9px 0}
.mgrid{display:grid;grid-template-columns:repeat(7,1fr);padding:10px 4px 6px;border-radius:24px}
.mgrid .wd{text-align:center;font-size:11px;font-weight:600;color:var(--fg2);padding-bottom:6px;text-transform:uppercase}
.mday{display:flex;flex-direction:column;align-items:center;gap:2px;padding:2px 0 6px;min-width:0}
.mday b{font:500 17px var(--rounded);width:36px;height:36px;display:grid;place-items:center;border-radius:50%}
.mday.out b{color:var(--fg3)}
.mday.today b{color:var(--accent);font-weight:700}
.mday.sel b{background:var(--fg);color:var(--base)}
.mday.sel.today b{background:var(--accent);color:var(--on-accent)}
.md{display:flex;gap:3px;height:5px}
.md i{width:5px;height:5px;border-radius:50%}
.md i.more{background:var(--fg3)}

/* золотой час */
:root{--gold:#ffb340}
.sunbar{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center;padding:11px 16px;border-radius:18px;font-size:14px;color:var(--fg2);text-align:left;width:100%}
.sunbar span{white-space:nowrap}
.sunbar .gh{color:var(--fg);font-weight:600}
.tl .gold{position:absolute;left:52px;right:0;background:linear-gradient(180deg,color-mix(in srgb,var(--gold) 26%,transparent),color-mix(in srgb,var(--orange) 16%,transparent));pointer-events:none}
.tl .gold span{position:absolute;right:8px;top:4px;font-size:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:color-mix(in srgb,var(--orange) 80%,var(--fg))}
.sunbox:empty{display:none}
.sunbox{display:flex;flex-direction:column;gap:8px;margin:-4px 0 14px}
.sunline{display:block;width:100%;text-align:left;padding:10px 14px;border-radius:14px;font-size:14px;line-height:1.45;background:color-mix(in srgb,var(--gold) 16%,var(--glass));border:1px solid color-mix(in srgb,var(--gold) 35%,transparent)}
.suntip{display:block;width:100%;text-align:left;padding:10px 14px;border-radius:14px;font-size:14px;background:color-mix(in srgb,var(--accent) 12%,transparent);color:var(--fg)}
.suntip b{color:var(--accent)}
.sunok{font-size:14px;color:var(--green);font-weight:600;padding:0 6px}
/* прайс-чипы, шаблоны, меню */
.chips.pk{margin:-4px -16px 12px}
.chips.pk:empty{display:none}
.chip{background:var(--fill)}
.chip.on{background:var(--accent);color:var(--on-accent)}
.chip.ghost{background:none;border:1px dashed var(--fg3);color:var(--fg2)}
.chev{color:var(--fg3);flex:none}
.chev svg{width:14px;height:14px}
.tok{padding:7px 11px;border-radius:999px;background:var(--fill);font-size:14px;font-weight:600;color:var(--accent)}
.recap-img{display:block;width:62%;max-width:260px;aspect-ratio:9/16;margin:0 auto 14px;border-radius:22px;box-shadow:0 16px 40px -14px rgba(0,0,0,.5);background:#2a1638}
/* импорт календаря */
.steps{margin:0 0 14px;padding:0 6px 0 26px;display:flex;flex-direction:column;gap:8px;font-size:15px;line-height:1.4}
.steps li::marker{color:var(--accent);font-weight:700}
.imp{padding:0}
.imp-m{padding:12px 16px 4px;font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--fg2)}
.imp-row{display:flex;align-items:center;gap:12px;padding:9px 16px;cursor:pointer}
.imp-row.off .rt{opacity:.45}
.imp-row .pill{flex:none}
.imp-bar{position:sticky;bottom:calc(-18px - env(safe-area-inset-bottom,0px));padding:10px 0 calc(18px + env(safe-area-inset-bottom,0px));margin:0 -16px -18px;padding-inline:16px;background:linear-gradient(transparent,var(--glass-strong) 30%)}
.imp-bar .btn:disabled{opacity:.5}
.ics-row{gap:8px}
.ics-row input{padding:14px 0}
.ics-row .tok{flex:none;padding:6px 10px;font-size:13px}
.ics-del{flex:none;width:28px;height:28px;border-radius:50%;background:var(--fill);color:var(--fg2);font-size:18px;line-height:1}

/* знакомство */
.onb{position:fixed;inset:0;z-index:98;display:grid;place-items:center;padding:calc(env(safe-area-inset-top,0px) + 20px) 16px calc(env(safe-area-inset-bottom,0px) + 20px);overflow-y:auto;
  background:var(--splash);transition:opacity .5s}
.onb.hide{opacity:0;pointer-events:none}
.onb-card{width:min(420px, calc(100vw - 32px));min-width:0;border-radius:32px;padding:22px 20px 18px;background:var(--glass-strong);display:flex;flex-direction:column;gap:16px;animation:rise .5s ease both}
.onb-body{text-align:center;display:flex;flex-direction:column;gap:12px}
.onb-body h2{margin:0;font:700 28px/1.15 var(--display);letter-spacing:-.02em;text-wrap:balance}
.onb-body p{margin:0 auto;color:var(--fg2);font-size:16px;max-width:30ch;text-wrap:balance}
.onb-body .form,.onb-body .seg{margin:0}
.onb-body .field input{text-align:left}
.onb-card .rt{min-width:0}.onb-card .t2{overflow:hidden;text-overflow:ellipsis}
.tpick{display:flex;align-items:center;justify-content:flex-end;gap:2px;flex:1}
.field .tpick select{flex:none;width:auto;direction:ltr;text-align:center;padding:14px 4px}
.tpick b{font-weight:600;color:var(--sub)}
.warn{margin:-6px 6px 14px;padding:10px 14px;border-radius:14px;font-size:14px;background:color-mix(in srgb,var(--orange) 16%,transparent);color:var(--text)}
.add-edit-row{opacity:1}.add-edit-row.off{opacity:.45}
.onb .lens.big{width:84px;height:84px;border-radius:50%;border:7px solid var(--accent);display:grid;place-items:center;margin:6px auto 4px;animation:focus 1.4s cubic-bezier(.3,1.4,.5,1) both}
.onb .lens.big svg{width:40px;height:40px;color:var(--accent)}
.onb-dots{display:flex;gap:6px;justify-content:center}
.onb-dots i{width:7px;height:7px;border-radius:50%;background:var(--fg3);transition:all .3s}
.onb-dots i.on{width:22px;border-radius:4px;background:var(--accent)}
.onb-skip{color:var(--fg2);font-size:15px;font-weight:600;padding:4px}

/* таб-бар */
.dock{position:fixed;left:0;right:0;bottom:0;padding:0 16px calc(env(safe-area-inset-bottom,0px) + 10px);z-index:20;pointer-events:none}
.dock-in{max-width:560px;margin:0 auto;display:flex;gap:10px;align-items:center}
.tabs{flex:1;display:flex;border-radius:999px;padding:5px;pointer-events:auto}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:7px 0 6px;border-radius:999px;font-size:10.5px;font-weight:600;color:var(--fg2);transition:background .25s,color .25s;min-width:0}
.tab svg{width:24px;height:24px}
.tab[aria-selected="true"]{color:var(--accent);background:var(--fill)}
/* «+» в центре таб-бара */
.fab{width:52px;height:52px;border-radius:50%;display:grid;place-items:center;flex:none;align-self:center;margin:0 4px;
  background:var(--accent);color:var(--on-accent);box-shadow:0 8px 20px -6px var(--accent);transition:transform .25s cubic-bezier(.3,1.5,.5,1)}
.fab svg{width:26px;height:26px}
.tab,.fab{-webkit-user-select:none;user-select:none}
.fab:active,.tab:active{transform:scale(.9)}
.tab svg{transition:transform .35s cubic-bezier(.3,1.6,.5,1)}
.tab[aria-selected="true"] svg{transform:translateY(-1px) scale(1.08)}

/* шторка */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.28);z-index:40;opacity:0;transition:opacity .3s}
.scrim.show{opacity:1}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:41;max-width:560px;margin:0 auto;max-height:92dvh;overflow-y:auto;
  border-radius:32px 32px 0 0;padding:8px 16px calc(env(safe-area-inset-bottom,0px) + 18px);background:var(--glass-strong);
  transform:translateY(105%);transition:transform .42s cubic-bezier(.2,.9,.25,1);overscroll-behavior:contain}
.sheet.show{transform:none}
.grabber{width:38px;height:5px;border-radius:3px;background:var(--fg3);margin:0 auto 10px}
.sheet-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px}
.sheet-head h3{margin:0;font:700 20px var(--display)}
.sheet-head .circle{width:36px;height:36px;background:var(--fill)}
.sheet-head .circle svg{width:16px;height:16px}
.sheet-head .link{color:var(--accent);font-weight:600;font-size:16px;margin-left:auto}

.seg{display:flex;background:var(--fill);border-radius:12px;padding:3px;margin-bottom:14px}
.seg label{flex:1;position:relative}
.seg input{position:absolute;opacity:0;pointer-events:none}
.seg span{display:block;text-align:center;padding:8px 4px;border-radius:9px;font-size:14px;font-weight:600;color:var(--fg2);transition:all .2s}
.seg input:checked+span{background:var(--base);color:var(--fg);box-shadow:0 2px 8px rgba(0,0,0,.12)}
.seg input:focus-visible+span{outline:2px solid var(--accent)}

.form{border-radius:18px;background:var(--glass);border:1px solid var(--edge);overflow:hidden;margin-bottom:14px}
.field{display:flex;align-items:center;gap:12px;padding:0 16px;min-height:52px;position:relative}
.field+.field::before{content:"";position:absolute;top:0;left:16px;right:0;height:1px;background:var(--sep)}
.field label{flex:none;width:110px;color:var(--fg2);font-size:16px}
.field input,.field select,.field textarea{flex:1;min-width:0;border:0;background:none;padding:14px 0;font-size:17px;outline:none;text-align:right;-webkit-appearance:none;appearance:none}
.field select{direction:rtl}
.field select option{direction:ltr}
.field input::placeholder,.field textarea::placeholder{color:var(--fg3)}
.field.col{flex-direction:column;align-items:stretch;gap:0}
.field.col label{padding-top:12px;width:auto;font-size:14px}
.field.col input,.field.col textarea{text-align:left;padding:6px 0 14px}
.field textarea{resize:none;min-height:60px}
.field input[type="date"],.field input[type="time"]{text-align:right;min-height:24px}
.sw{position:relative;width:51px;height:31px;flex:none;margin-left:auto;-webkit-appearance:none;appearance:none;border-radius:999px;background:var(--fill);transition:background .25s;padding:0!important;flex:none!important;cursor:pointer}
.sw::after{content:"";position:absolute;top:2px;left:2px;width:27px;height:27px;border-radius:50%;background:#fff;box-shadow:0 3px 8px rgba(0,0,0,.2);transition:transform .25s}
.sw:checked{background:var(--green)}
.sw:checked::after{transform:translateX(20px)}
.cats{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.cats label{position:relative}
.cats input{position:absolute;opacity:0}
.cats span{display:block;padding:8px 13px;border-radius:999px;background:var(--fill);font-size:15px;font-weight:500}
.cats input:checked+span{background:var(--accent);color:var(--on-accent)}
.cats input:focus-visible+span{outline:2px solid var(--accent);outline-offset:2px}
.hint{font-size:13px;color:var(--fg2);margin:-6px 6px 14px}
.actions{display:flex;flex-direction:column;gap:10px}
.stepper{display:flex;align-items:center;gap:6px;margin-left:auto}
.stepper button{width:34px;height:34px;border-radius:50%;background:var(--fill);font-size:20px;font-weight:600;color:var(--accent)}
.stepper output{min-width:34px;text-align:center;font:600 18px var(--rounded)}

/* заставка */
.splash{position:fixed;inset:0;z-index:100;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:32px;text-align:center;
  background:var(--splash);
  color:#fff;transition:opacity .6s ease,transform .6s ease}
.splash.hide{opacity:0;transform:scale(1.04);pointer-events:none}
.splash .lens{width:84px;height:84px;border-radius:50%;border:7px solid rgba(255,255,255,.95);display:grid;place-items:center;margin-bottom:34px;
  -webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);background:rgba(255,255,255,.14);animation:focus 1.6s cubic-bezier(.3,1.4,.5,1) both}
.splash .lens svg{width:40px;height:40px;color:#fff}
.splash p{font:700 clamp(30px,8.5vw,44px)/1.12 var(--display);letter-spacing:-.02em;margin:0;max-width:14ch;text-wrap:balance;animation:rise .9s .25s ease both}
.splash small{position:absolute;bottom:calc(env(safe-area-inset-bottom,0px) + 34px);font-size:14px;opacity:.7;animation:rise .9s .7s ease both}
@keyframes focus{from{transform:scale(1.6);opacity:0;filter:blur(8px)}to{transform:none;opacity:1;filter:none}}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}

/* поздравления */
.celebrate{position:fixed;inset:0;z-index:95;display:grid;place-items:center;padding:24px;background:rgba(0,0,0,.35);opacity:0;transition:opacity .35s}
.celebrate.show{opacity:1}
.celebrate canvas{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.cel-card{position:relative;width:100%;max-width:340px;border-radius:32px;padding:30px 22px 20px;text-align:center;background:var(--glass-strong);transform:scale(.85);transition:transform .5s cubic-bezier(.3,1.5,.5,1)}
.celebrate.show .cel-card{transform:none}
.cel-ic{width:76px;height:76px;border-radius:24px;margin:0 auto 16px;display:grid;place-items:center;color:var(--on-grad);background:var(--grad-warm);box-shadow:0 12px 30px -10px var(--accent)}
.cel-ic svg{width:40px;height:40px}
.cel-card h2{margin:0 0 8px;font:700 26px/1.15 var(--display);letter-spacing:-.01em;text-wrap:balance}
.cel-card p{margin:0 0 22px;color:var(--fg2);font-size:16px;text-wrap:balance}

.toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 12px);transform:translate(-50%,calc(-100% - env(safe-area-inset-top,0px) - 60px));opacity:0;z-index:99;padding:11px 18px;border-radius:999px;font-weight:600;font-size:15px;transition:transform .4s cubic-bezier(.2,.9,.25,1),opacity .3s;max-width:calc(100% - 32px);text-align:center}
.toast.show{transform:translate(-50%,0);opacity:1}
.toast{display:flex;align-items:center;gap:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.toast .tt{min-width:0;overflow:hidden;text-overflow:ellipsis}
.toast-undo{flex:none;color:var(--on-accent);background:var(--accent);font-weight:700;font-size:16px;padding:9px 16px;margin:-4px -10px -4px 0;border-radius:999px}
/* с кнопкой «Отменить» — текст целиком, кнопка во всю ширину под ним */
.toast.undo{flex-direction:column;align-items:stretch;gap:10px;white-space:normal;border-radius:22px;padding:14px 16px 12px;width:min(360px, calc(100% - 32px))}
.toast.undo .tt{overflow:visible;line-height:1.3}
.toast.undo .toast-undo{margin:0;padding:11px 16px;text-align:center}
.stick{position:sticky;bottom:calc(-1 * env(safe-area-inset-bottom,0px) - 18px);z-index:3;margin:0 -16px;padding:12px 16px calc(env(safe-area-inset-bottom,0px) + 18px);
  background:linear-gradient(to top,var(--glass-strong) 70%,transparent);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
.stick + .actions{margin-top:4px}
.sheet textarea{resize:none;overflow-y:auto}
.linkbtn{display:block;margin:2px auto 0;padding:8px 12px;font-size:14px;font-weight:600;color:var(--fg2)}

.install{display:flex;gap:12px;align-items:flex-start}
.install p{margin:0;font-size:15px}
.install b{display:block;margin-bottom:2px}
.install .x{margin-left:auto;color:var(--fg2);font-size:22px;line-height:1;padding:0 4px}

@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
}

// неоплаченное по записям и абонементам ДО начала месяца ym (долги прошлых месяцев)
function debtsBefore(ym){
  const from = ym + '-01', out = [];
  for (const e of data.entries){ const p = payState(e); if (e.date && e.date < from && p && p.due > 0 && !e.subId) out.push(e); }
  for (const x of data.subs){ const p = payState(x); if (x.date && x.date < from && p && p.due > 0) out.push(x); }
  return out.sort((a, b) => a.date.localeCompare(b.date));
}
const dueOf = x => (payState(x) || {}).due || 0;
// Деньги считаются по дню, когда они пришли: задаток — когда его внесли (prepaidAt), остаток — когда отметили «оплачено» (paidAt).
// У старых записей без этих дат: задаток — день создания записи, остаток — день съёмки (если он уже прошёл).
const isoDay = ts => { const d = new Date(ts); return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); };
function payments(x){
  const sum = +(x.amount ?? x.price) || 0; if (!sum || !x.date) return [];
  const pre = Math.min(+x.prepaid || 0, sum), made = x.created ? isoDay(x.created) : x.date, t = today();
  const preDay = x.prepaidAt || (made < x.date ? made : x.date);
  if (x.paid && pre >= sum) return [{d: preDay, a: sum}];
  const out = pre ? [{d: preDay, a: pre}] : [];
  if (x.paid) out.push({d: x.paidAt || (x.date <= t ? x.date : made), a: sum - pre});
  return out;
}
// отметки дат оплаты при сохранении: old — как было, rec — как стало
function stampPay(rec, old = {}){
  const t = today();
  if (+rec.prepaid > 0) rec.prepaidAt = +old.prepaid > 0 && old.prepaidAt ? old.prepaidAt : t; else delete rec.prepaidAt;
  if (rec.paid) rec.paidAt = old.paid && old.paidAt ? old.paidAt : t; else delete rec.paidAt;
  return rec;
}
function stats(ym){
  const inc = {shoot:0, retouch:0, lesson:0, other:0, task:0}; let unpaid = 0, got = 0, count = 0;
  for (const e of data.entries){
    for (const p of payments(e)) if (p.d.slice(0,7) === ym){ inc[e.type] = (inc[e.type]||0) + p.a; got += p.a; }
    if (!e.date || e.date.slice(0,7) !== ym) continue;
    count++; const p = payState(e); if (p) unpaid += p.due;
  }
  for (const s of data.subs){
    for (const p of payments(s)) if (p.d.slice(0,7) === ym){ inc.lesson += p.a; got += p.a; }
    if (!s.date || s.date.slice(0,7) !== ym) continue;
    const p = payState(s); if (p) unpaid += p.due;
  }
  const exp = {}; let expT = 0;
  let expPlan = 0;
  for (const x of data.expenses){
    if (!x.date || x.date.slice(0,7) !== ym) continue;
    if (x.paid === false){ expPlan += +x.amount||0; continue; } // ожидается — не считаем, пока не подтвердили
    exp[x.cat] = (exp[x.cat]||0) + (+x.amount||0); expT += +x.amount||0;
  }
  const incT = Object.values(inc).reduce((a,b)=>a+b,0);
  return {inc, incT, unpaid, got, exp, expT, expPlan, net: incT - expT, count};
}

}

  const cl = data.clients.length;

  if (data.goal && earned >= data.goal) once('goal'+m, 'trophy', 'Цель месяца выполнена!', `${g('Ты заработал[а|]')} ${rub(earned)} при цели ${rub(data.goal)}. Это победа!`);
  const prev = allMonths().filter(x => x < m).map(x => stats(x).incT).filter(v => v > 0);
  if (prev.length >= 2 && earned > Math.max(...prev)) once('record'+m, 'trophy', 'Рекордный месяц!', `Ещё никогда доход не был таким высоким: ${rub(earned)}. Ты растёшь!`);
  if (ctx.subDone) once('subdone'+ctx.subDone.id, 'medal', 'Абонемент пройден', `${clientName(ctx.subDone)}: пройдены все ${ctx.subDone.total} ${plural(ctx.subDone.total,'занятие','занятия','занятий')}. Самое время предложить продолжение!`);

  if (ctx.silent){ persist(); return; }
  persist();
  celebrateQueue.push(...q);

}

function confetti(){
  if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const cv = $('#confetti'), ctx = cv.getContext('2d'), dpr = devicePixelRatio || 1;
  cv.width = innerWidth * dpr; cv.height = innerHeight * dpr; ctx.scale(dpr, dpr);
  const cs = getComputedStyle(document.documentElement);
  const colors = ['--pink','--orange','--teal','--indigo','--green'].map(v => cs.getPropertyValue(v).trim());
  const ps = Array.from({length:140}, () => ({x:innerWidth/2 + (Math.random()-.5)*80, y:innerHeight*.42, vx:(Math.random()-.5)*14, vy:-Math.random()*15-4, r:Math.random()*Math.PI, vr:(Math.random()-.5)*.3, w:6+Math.random()*6, h:4+Math.random()*4, c:colors[Math.floor(Math.random()*colors.length)]}));
  const start = performance.now();
  (function frame(t){
    ctx.clearRect(0,0,innerWidth,innerHeight);
    for (const p of ps){ p.vy += .35; p.vx *= .99; p.x += p.vx; p.y += p.vy; p.r += p.vr;
      ctx.save(); ctx.translate(p.x,p.y); ctx.rotate(p.r); ctx.fillStyle = p.c; ctx.fillRect(-p.w/2,-p.h/2,p.w,p.h); ctx.restore(); }
    if (t - start < 3200) requestAnimationFrame(frame); else ctx.clearRect(0,0,innerWidth,innerHeight);
  })(start);
}

/* --- вкладка «План»: календарь день / неделя / месяц --- */
const WD_SHORT = ['пн','вт','ср','чт','пт','сб','вс'];
const weekStart = s => { const d = parseD(s); d.setDate(d.getDate() - (d.getDay() + 6) % 7); return dstr(d); };
const toMin = t => { const [h,m] = t.split(':').map(Number); return h*60 + m; };
const hhmm = m => pad(Math.floor(m/60) % 24) + ':' + pad(m % 60);
const DURS = [[30,'30 мин'],[60,'1 час'],[90,'1,5 часа'],[120,'2 часа'],[180,'3 часа'],[240,'4 часа'],[360,'6 часов'],[480,'8 часов'],[720,'12 часов']];
const durOf = e => +e.dur || 60;
// ---------- повторяющиеся дела ----------
// e.repeat = {f:'daily'|'weekdays'|'weekly'|'monthly', until:'YYYY-MM-DD'|''}; e.date — первый день.
// У каждого повтора своя галочка (e.doneOn[дата]) и свои удаления/переносы (e.skip = [даты]).
const REPEATS = [['', 'Не повторять'], ['hours', 'Несколько раз в день'], ['daily', 'Каждый день'], ['every2', 'Через день'], ['weekdays', 'По будням'], ['weekly', 'Каждую неделю'], ['monthly', 'Каждый месяц']];
// «каждые N часов»: в один день несколько раз — с e.time до repeat.to; ключ такого повтора «дата время»
function repTimes(e){
  const r = e.repeat, start = toMin(e.time || '08:00'), end = Math.max(toMin(r.to || '21:00'), start), step = Math.max(1, +r.step || 3) * 60, out = [];
  for (let m = start; m <= end && out.length < 24; m += step) out.push(pad(Math.floor(m / 60)) + ':' + pad(m % 60));
  return out;
}
const isRepeat = e => !!(e && e.repeat && e.repeat.f);
function occursOn(e, ds){
  if (!isRepeat(e)) return ds === e.date;
  const r = e.repeat;
  if (ds < e.date || (r.until && ds > r.until) || (e.skip || []).includes(ds)) return false;
  const d = parseD(ds), s0 = parseD(e.date);
  if (r.f === 'daily' || r.f === 'hours') return true;
  if (r.f === 'every2') return Math.round((d - s0) / 864e5) % 2 === 0;
  if (r.f === 'weekdays') return d.getDay() >= 1 && d.getDay() <= 5;
  if (r.f === 'weekly') return d.getDay() === s0.getDay();
  if (r.f === 'monthly') return d.getDate() === s0.getDate();
  return false;
}
// повтор как отдельная запись на конкретный день (id тот же, occ — его дата)
const occOf = (e, ds, tm) => { const k = tm ? ds + ' ' + tm : ds; return {...e, date: ds, time: tm || e.time, occ: k, done: !!(e.doneOn && e.doneOn[k])}; };
// повтор по ключу из разметки: «2026-10-16» или «2026-10-16 14:00»
const occFrom = (e, k) => k.length > 10 ? occOf(e, k.slice(0, 10), k.slice(11)) : occOf(e, k);
const occDay = k => dayLabel(k.slice(0, 10)).toLowerCase() + (k.length > 10 ? ' в ' + k.slice(11) : '');
// все записи в интервале дат, с развёрнутыми повторами
function expandEntries(from, to){
  const out = [];
  for (const e of data.entries){
    if (!e.date) continue;
    if (!isRepeat(e)){ if (e.date >= from && e.date <= to) out.push(e); continue; }
    const end = e.repeat.until && e.repeat.until < to ? e.repeat.until : to;
    let ds = e.date > from ? e.date : from, guard = 0;
    while (ds <= end && guard++ < 900){
      if (occursOn(e, ds)){
        if (e.repeat.f === 'hours'){ for (const tm of repTimes(e)) if (!(e.skip || []).includes(ds + ' ' + tm)) out.push(occOf(e, ds, tm)); }
        else out.push(occOf(e, ds));

      ds = shiftDay(ds, 1);

}
const occAttr = e => e && e.occ ? ` data-occ="${e.occ}"` : '';
const repeatLabel = e => !isRepeat(e) ? '' : e.repeat.f === 'hours' ? `каждые ${+e.repeat.step || 3} ч` : (REPEATS.find(r => r[0] === e.repeat.f) || ['',''])[1].toLowerCase();
// время: два барабана (часы и минуты через 10) вместо поминутного; значение — в скрытом поле, как раньше
function timePicker(id, name, v){
  const [h, m] = /^\d{2}:\d{2}$/.test(v || '') ? v.split(':') : ['', ''];

}

// Свайп записи (Главная, Календарь), как в Telegram: влево — «Закрепить», «Без звука», «Удалить»; вправо — «Сделано».
(function(){
  let row = null, sx = 0, sy = 0, dx = 0, mode = '', open = null, swallow = false;
  const close = r => { if (!r) return; r.style.transform = ''; setTimeout(() => { if (r !== open) r.querySelectorAll('.swacts,.swdone').forEach(n => n.remove()); }, 260); };
  const entryOf = r => { const e = data.entries.find(x => x.id === r.dataset.id); return e && r.dataset.occ && isRepeat(e) ? {e, o: occFrom(e, r.dataset.occ)} : {e, o: e}; };
  document.addEventListener('touchstart', ev => {
    const r = ev.target.closest('#app .list .row[data-act="edit"]');
    if (open && r !== open){ close(open); open = null; }
    if (!r || ev.touches.length > 1) { row = null; return; }
    row = r; sx = ev.touches[0].clientX; sy = ev.touches[0].clientY; dx = 0; mode = '';
  }, {passive:true});
  document.addEventListener('touchmove', ev => {
    if (!row) return;
    const x = ev.touches[0].clientX - sx, y = ev.touches[0].clientY - sy;
    if (!mode){ if (Math.abs(x) < 10 && Math.abs(y) < 10) return; mode = Math.abs(x) > Math.abs(y) * 1.2 ? 'h' : 'v'; if (mode === 'h') prepare(row); }
    if (mode !== 'h') return;
    const base = row === open ? -216 : 0, {o} = entryOf(row);
    dx = Math.max(-240, Math.min(checkable(o) ? 130 : 0, base + x));
    row.classList.add('swipe', 'dragging'); row.style.transform = `translateX(${dx}px)`;
  }, {passive:true});
  document.addEventListener('touchend', () => {
    if (!row || mode !== 'h'){ row = null; return; }
    const r = row; row = null; r.classList.remove('dragging'); swallow = true; setTimeout(() => { swallow = false; }, 350);
    if (dx < -70){ r.style.transform = 'translateX(-216px)'; open = r; if (navigator.vibrate) navigator.vibrate(8); return; }
    if (dx > 90){ const b = r.querySelector('[data-act="done"]'); close(r); open = null; if (b) setTimeout(() => b.click(), 120); return; }
    close(r); if (open === r) open = null;
  });
  // нажатие после свайпа не должно открывать карточку
  document.addEventListener('click', ev => { if (swallow && !ev.target.closest('.swacts')){ ev.stopPropagation(); ev.preventDefault(); } }, true);
  function prepare(r){
    if (r.querySelector('.swacts')) return;
    const {e} = entryOf(r); if (!e) return;
    r.insertAdjacentHTML('beforeend', `<div class="swacts">
      <button class="s-pin" data-act="sw-pin" data-id="${e.id}"><i>${ICONS.pin}</i>${e.pin ? 'Открепить' : 'Закрепить'}</button>
      <button class="s-mute" data-act="sw-mute" data-id="${e.id}"><i>${e.mute ? ICONS.bell : ICONS.bellOff}</i>${e.mute ? 'Вернуть звук' : 'Убрать звук'}</button>
      <button class="s-del" data-act="sw-del" data-id="${e.id}"${r.dataset.occ ? ` data-occ="${r.dataset.occ}"` : ''}><i>${ICONS.trash}</i>Удалить</button></div>`
      + (checkable(entryOf(r).o) ? `<div class="swdone"><i>${ICONS.tick}</i>${entryOf(r).o.done ? 'Вернуть' : 'Сделано'}</div>` : ''));
  }
})();

  h += todayList.length ? prioList(todayList)
    : `<button class="card glass empty" data-act="new-on" data-d="${t}" style="padding:18px;width:100%"><b style="font-size:16px">Сегодня свободно</b><p>Нажми, чтобы что-то запланировать</p></button>`;

  // ближайшее — следующие 5 записей после сегодня
  const seen = new Set();
  const next = expandEntries(shiftDay(t, 1), shiftDay(t, 120)).filter(e => !(checkable(e) && e.done))
    .sort((a, b) => (a.date + (a.time || '')).localeCompare(b.date + (b.time || '')))
    .filter(e => !seen.has(e.id) && seen.add(e.id)).slice(0, 5);
  if (next.length) h += `<div class="section-title">Ближайшее</div><div class="list glass">${next.map(e => entryRow(e, {showDate:true})).join('')}</div>`;
  return h + `</div>`;
}

function moveEntry(id, d, tm, occ){

function weekStrip(map){
  const ws = weekStart(ui.selDate), t = today();
  return `<div class="strip glass">${Array.from({length:7}, (_,i) => {
    const d = shiftDay(ws, i);
    return `<button class="${d===t?'today':''} ${d===ui.selDate?'sel':''}" data-act="pick-day" data-d="${d}">${WD_SHORT[i]}<b>${+d.slice(8)}</b><i ${map[d]?'':'style="visibility:hidden"'}></i></button>`;
  }).join('')}</div>`;
}

function calDay(map){
  const list = map[ui.selDate] || [];
  const allDay = list.filter(e => e.type === 'retouch' || !e.time);
  const timed = list.filter(e => e.type !== 'retouch' && e.time).map(e => ({e, s:toMin(e.time), e2:Math.min(toMin(e.time) + durOf(e), 24*60)}));
  // раскладка пересекающихся событий по колонкам
  timed.sort((a,b) => a.s - b.s || b.e2 - a.e2);
  let cluster = [], cEnd = -1;
  const flush = () => { const lanes = []; for (const x of cluster){ let i = lanes.findIndex(end => end <= x.s); if (i < 0){ i = lanes.length; lanes.push(0); } lanes[i] = x.e2; x.lane = i; } cluster.forEach(x => x.lanes = lanes.length); cluster = []; cEnd = -1; };
  for (const x of timed){ if (cluster.length && x.s >= cEnd) flush(); cluster.push(x); cEnd = Math.max(cEnd, x.e2); }
  if (cluster.length) flush();

  const startH = Math.min(7, ...timed.map(x => Math.floor(x.s/60)));
  const endH = Math.max(23, ...timed.map(x => Math.ceil(x.e2/60)));
  const HH = 56, L = 52, top = 10;
  const y = m => top + (m - startH*60) / 60 * HH;
  let h = weekStrip(map) + sunBar(ui.selDate);
  const sun = prof().sun ? sunInfo(ui.selDate) : null;
  const sum = list.reduce((a,e) => a + (+e.amount||0), 0);
  if (sum) h += `<div class="day"><span>${list.length} ${plural(list.length,'запись','записи','записей')}</span><span class="num">${rub(sum)}</span></div>`;
  if (allDay.length) h += `<div class="allday">${allDay.map(evChip).join('')}</div>`;
  h += `<div class="tl glass" data-act="slot" data-h="${startH}" style="height:${(endH - startH) * HH + top*2}px">`;
  // золотой час — тёплая полоса на шкале
  if (sun) for (const [a, b] of [[sun.mS, sun.mE], [sun.eS, sun.eE]]){
    if (a == null || b == null) continue;
    const top2 = Math.max(y(a), y(startH*60)), bot = Math.min(y(b), y(endH*60));
    if (bot > top2) h += `<i class="gold" style="top:${top2}px;height:${bot - top2}px"><span>золотой час</span></i>`;
  }
  for (let hr = startH; hr <= endH; hr++) h += `<i class="hr" style="top:${y(hr*60)}px"></i><span class="hl" style="top:${y(hr*60)}px">${pad(hr % 24)}:00</span>`;
  if (ui.selDate === today()){ const n = new Date(), m = n.getHours()*60 + n.getMinutes(); if (m >= startH*60 && m <= endH*60) h += `<i class="now" style="top:${y(m)}px"></i>`; }
  for (const x of timed){
    const t = TYPES[x.e.type] || TYPES.other;
    const hgt = Math.max(y(x.e2) - y(x.s) - 2, 24);
    const w = `calc((100% - ${L + 8}px) / ${x.lanes})`;
    const cn = clientName(x.e);
    h += `<button class="ev ${hgt < 40 ? 'short' : ''}" style="--c:${t.color};top:${y(x.s)+1}px;height:${hgt}px;left:calc(${L}px + (100% - ${L + 8}px) / ${x.lanes} * ${x.lane});width:${w}" data-act="edit" data-id="${x.e.id}">
      <b>${esc(x.e.title || t.one)}</b><span>${x.e.time}–${hhmm(x.e2)}${cn ? ' · ' + esc(cn) : ''}</span></button>`;
  }
  h += `</div>`;
  if (!list.length) h += `<p class="hint" style="margin:-4px 6px 0;text-align:center">Свободный день. Нажми на время в календаре, чтобы добавить запись.</p>`;
  return h;
}

function calWeek(map){
  const ws = weekStart(ui.selDate), t = today();
  let total = 0;
  const rows = Array.from({length:7}, (_,i) => {
    const d = shiftDay(ws, i), list = map[d] || [];
    total += list.reduce((a,e) => a + (+e.amount||0), 0);
    return `<div class="wrow ${d===t?'today':''}">
      <button class="wdate" data-act="open-day" data-d="${d}"><small>${WD_SHORT[i]}</small><b>${+d.slice(8)}</b></button>
      <div class="wev">${list.length ? list.map(evChip).join('') : `<button class="free" data-act="new-on" data-d="${d}">Свободно</button>`}</div>
    </div>`;
  }).join('');
  return `<div class="list glass week">${rows}</div>${total ? `<div class="day"><span>Итого за неделю</span><span class="num">${rub(total)}</span></div>` : ''}`;
}

function calMonth(map){
  const first = ui.selDate.slice(0,7) + '-01', start = weekStart(first), t = today();
  const [y,m] = first.split('-').map(Number), last = `${first.slice(0,8)}${pad(new Date(y, m, 0).getDate())}`;
  const weeks = Math.ceil((daysBetween(start, last) + 1) / 7);
  let h = `<div class="mgrid glass">${WD_SHORT.map(w => `<span class="wd">${w}</span>`).join('')}`;
  for (let i = 0; i < weeks*7; i++){
    const d = shiftDay(start, i), list = map[d] || [];
    const dots = list.slice(0,3).map(e => `<i style="background:${(TYPES[e.type]||TYPES.other).color}"></i>`).join('') + (list.length > 3 ? '<i class="more"></i>' : '');
    h += `<button class="mday ${d.slice(0,7)!==first.slice(0,7)?'out':''} ${d===t?'today':''} ${d===ui.selDate?'sel':''}" data-act="pick-day" data-d="${d}" aria-label="${dayLabel(d)}${map[d] ? ', записей: ' + map[d].length : ''}"><b>${+d.slice(8)}</b><span class="md">${dots}</span></button>`;
  }
  h += `</div>`;
  const list = map[ui.selDate] || [];
  const sum = list.reduce((a,e) => a + (+e.amount||0), 0);
  h += `<div class="day ${ui.selDate===t?'today':''}"><span>${dayLabel(ui.selDate)}</span><span class="num">${sum?rub(sum):''}</span></div>`;
  h += list.length ? prioResetBtn() + prioList(list)
    : `<button class="card glass empty" data-act="new-on" data-d="${ui.selDate}" style="padding:20px;width:100%"><b style="font-size:16px">Свободный день</b><p>Нажми, чтобы добавить запись</p></button>`;
  return h;
}

function subCard(s, withName){

}

    <circle cx="54" cy="54" r="${r}" fill="none" stroke="var(--fill)" stroke-width="12"/>
    <circle cx="54" cy="54" r="${r}" fill="none" stroke="url(#rg)" stroke-width="12" stroke-linecap="round" stroke-dasharray="${(c*v).toFixed(1)} ${c.toFixed(1)}"/></svg>`;
}

function renderHistory(){

  const ym = []; for (let m = 1; m <= 12; m++) ym.push(`${year}-${pad(m)}`);
  const ys = ym.map(stats);
  const inc = ys.reduce((a,s) => a + s.incT, 0), exp = ys.reduce((a,s) => a + s.expT, 0);
  const active = ys.filter(s => s.incT || s.expT).length;
  let best = -1, bestV = 0; ys.forEach((s,i) => { if (s.incT > bestV){ bestV = s.incT; best = i; } });
  const hasMonth = data.entries.some(e => e.date && e.date.slice(0,7) === ui.month && e.date <= today());
  let h = `<div class="stack">
    ${hasMonth ? `<button class="card glass phrase" data-act="recap" data-m="${ui.month}"><span class="spark" style="background:var(--grad-warm)">${ICONS.trophy}</span>
      <p>Итоги: ${MONTHS[+ui.month.slice(5)-1]}<small>Красивая картинка для сторис</small></p></button>` : ''}
    <div class="card glass"><h2>Доход за 12 месяцев</h2><div class="chart" id="chart"></div>
      <div class="legend" style="flex-direction:row;flex-wrap:wrap;gap:8px 16px;margin-top:12px">${incomeTypes().map(k=>`<div class="lg" style="font-size:13px"><span class="dot" style="background:${TYPES[k].color}"></span>${TYPES[k].many}</div>`).join('')}</div>
    </div>
    <div class="section-title">${year} год</div>
    <div class="stats">
      <div class="card glass stat"><div class="label">Доход</div><b>${shortRub(inc)}</b><span>${rub(inc)}</span></div>
      <div class="card glass stat"><div class="label">Чистыми</div><b>${shortRub(inc-exp)}</b><span>расходы ${shortRub(exp)}</span></div>
      <div class="card glass stat"><div class="label">Лучший месяц</div><b style="text-transform:capitalize">${best>=0?MONTHS[best]:'—'}</b><span>${best>=0?rub(bestV):'пока нет данных'}</span></div>
      <div class="card glass stat"><div class="label">В среднем</div><b>${active?shortRub(inc/active):'—'}</b><span>в месяц</span></div>
    </div>
    <div class="section-title">По месяцам</div><div class="list glass">`;
  const rows = months.slice().reverse().map(m => ({m, s: stats(m)})).filter(x => x.s.incT || x.s.expT);
  if (!rows.length) h += `<div class="empty"><b>История появится сама</b><p>Каждая запись с суммой попадает сюда. Можно смотреть, как растёт доход.</p></div>`;
  h += rows.map(({m,s}) => {
    const parts = Object.keys(TYPES).filter(k => s.inc[k]).map(k => `${TYPES[k].many.toLowerCase()} ${shortRub(s.inc[k])}`);
    if (s.expT) parts.push(`расходы ${shortRub(s.expT)}`);
    const [y,mm] = m.split('-').map(Number);
    return `<div class="row" data-act="open-month" data-m="${m}" role="button" tabindex="0">
      <span class="ic" style="--c:var(--grad);color:var(--on-grad);font:700 13px var(--rounded)">${MONTHS_S[mm-1]}</span>
      <div class="rt"><div class="t1" style="text-transform:capitalize">${MONTHS[mm-1]} ${y}</div><div class="t2">${esc(parts.join(' · '))}</div></div>
      <div class="rr"><div class="amt ${s.net<0?'neg':''}">${rub(s.net)}</div></div></div>`;
  }).join('');
  return h + `</div></div>`;
}

function drawChart(){
  const el = $('#chart'); if (!el) return;
  const W = Math.max(280, el.clientWidth), H = 190, L = 44, B = 22, T = 8;
  const months = []; for (let i = 11; i >= 0; i--) months.push(addMonth(ui.month, -i));
  const ss = months.map(stats);
  const maxV = Math.max(...ss.map(s => s.incT), 1);
  const stepRaw = maxV / 4, mag = Math.pow(10, Math.floor(Math.log10(stepRaw)));
  const step = [1,2,2.5,5,10].map(x => x*mag).find(x => x >= stepRaw);
  const top = step * 4;
  const y = v => T + (H - T - B) * (1 - v/top);
  const bw = (W - L) / 12, w = Math.max(6, bw * .56);
  let svg = `<svg viewBox="0 0 ${W} ${H}" height="${H}" role="img" aria-label="Доход по месяцам">`;
  for (let i = 0; i <= 4; i++){
    const v = step * i, yy = y(v).toFixed(1);
    svg += `<line class="grid" x1="${L}" x2="${W}" y1="${yy}" y2="${yy}" stroke-width="1"/><text x="${L-8}" y="${(+yy+4).toFixed(1)}" text-anchor="end">${v ? shortRub(v).replace(' тыс','к').replace(' млн','м') : '0'}</text>`;
  }
  ss.forEach((s,i) => {
    const x = L + bw*i + (bw - w)/2; let acc = 0;
    const keys = Object.keys(TYPES).filter(k => s.inc[k]);
    keys.forEach((k,j) => {
      const y1 = y(acc + s.inc[k]), y0 = y(acc); acc += s.inc[k];
      const isTop = j === keys.length - 1, hgt = Math.max(0, y0 - y1);
      svg += isTop
        ? `<path d="M${x},${y0} V${y1+Math.min(4,hgt)} q0,-4 4,-4 h${w-8} q4,0 4,4 V${y0} Z" fill="${TYPES[k].color}"/>`
        : `<rect x="${x}" y="${y1}" width="${w}" height="${hgt}" fill="${TYPES[k].color}"/>`;
    });
    const mm = +months[i].slice(5);
    const cur = months[i] === ui.month;
    if (!(bw < 30 && !cur && (11 - i) % 2)) svg += `<text x="${(x + w/2).toFixed(1)}" y="${H-5}" text-anchor="middle" style="${cur?'fill:var(--fg);font-weight:700':''}">${MONTHS_S[mm-1].slice(0,3)}</text>`;
    svg += `<rect x="${L+bw*i}" y="0" width="${bw}" height="${H}" fill="transparent" data-act="open-month" data-m="${months[i]}" style="cursor:pointer"/>`;
  });
  el.innerHTML = svg + `</svg>`;
}

// шторка закрывается свайпом вниз (когда она прокручена до самого верха)
(function(){
  const sh = $('#sheet'); let y0 = null, dy = 0, drag = false;
  sh.addEventListener('touchstart', e => { y0 = sh.scrollTop <= 0 ? e.touches[0].clientY : null; dy = 0; drag = false; }, {passive:true});
  sh.addEventListener('touchmove', e => {
    if (y0 === null) return;
    dy = e.touches[0].clientY - y0;
    if (dy > 6 && sh.scrollTop <= 0){
      drag = true; e.preventDefault();
      sh.style.transition = 'none'; sh.style.transform = `translateY(${dy}px)`;
      $('#scrim').style.opacity = String(Math.max(0, 1 - dy / 400));
    } else if (dy < 0) y0 = null;
  }, {passive:false});
  sh.addEventListener('touchend', () => {
    if (drag){
      sh.style.transition = ''; sh.style.transform = ''; $('#scrim').style.opacity = '';
      if (dy > 110) closeSheet();
    }
    y0 = null; drag = false;
  });
})();

        <input type="hidden" name="emoji" id="f-emoji" value="${esc(e.emoji||'')}">

      <div class="form" id="payBox" ${e.type==='task'?'hidden':''}>

        <div class="field"><label for="f-pre">Предоплата, ₽</label><input id="f-pre" name="prepaid" inputmode="decimal" value="${e.prepaid||''}" placeholder="0"></div>
        <div class="field"><label for="f-paid" style="width:auto">Оплачено полностью</label><input type="checkbox" class="sw" id="f-paid" name="paid" ${e.paid?'checked':''}></div>

      <div class="form" id="doneBox" ${checkable(e)?'':'hidden'}>
        <div class="field"><label for="f-done" style="width:auto" id="l-done">${e.type==='task'?'Сделано':prof().post.done}</label><input type="checkbox" class="sw" id="f-done" name="done" ${e.done?'checked':''}></div>
      </div>
      <div class="form"><div class="field col"><label for="f-note">Заметка</label><textarea id="f-note" name="note" rows="2" placeholder="${e.type==='task'?'С кем, что взять с собой…':ph('note')}">${esc(e.note||'')}</textarea></div></div>

      <div class="stick"><button type="submit" class="btn primary" style="width:100%">${isNew ? 'Добавить' : 'Сохранить'}</button></div>
      <div class="actions">
        ${isNew ? '' : occ ? `<button type="button" class="btn danger" data-act="del-occ" data-id="${e.id}" data-occ="${occ}">Удалить только ${occDay(occ)}</button>
        <button type="button" class="btn danger" data-act="del-entry" data-id="${e.id}">Удалить все повторы</button>`
        : `<button type="button" class="btn danger" data-act="del-entry" data-id="${e.id}">Удалить</button>`}
      </div>
    </form>`);
  const form = $('#entryForm');
  const curType = () => form.querySelector('input[name="f-type"]:checked').value;
  // повтор: показываем «До», а галочку «Сделано» у серии прячем — она ставится у каждого дня в списке
  const syncRepeat = () => { const r = !!$('#f-rep').value && curType() === 'task'; $('#untilField').hidden = !r; $('#hoursBox').hidden = !(r && $('#f-rep').value === 'hours'); if (r) $('#doneBox').hidden = true;
    if (r && $('#f-rep').value === 'hours' && !$('#f-time').value) setTime('f-time', '08:00'); };
  $('#f-rep').addEventListener('change', syncRepeat); syncRepeat();
  $('#iconPick').addEventListener('click', () => { $('#emojiGrid').hidden = !$('#emojiGrid').hidden; });
  $('#emojiGrid').addEventListener('click', ev => {
    const b = ev.target.closest('[data-emo]'); if (!b) return;
    const v = b.dataset.emo; $('#f-emoji').value = v;
    $('#emojiGrid').querySelectorAll('[data-emo]').forEach(x => x.classList.toggle('on', x === b));
    $('#iconCur').innerHTML = v ? esc(v) : iconFor({type:curType(), format:'meet'});
    $('#emojiGrid').hidden = true;
  });
  // услуги из прайса для выбранного типа
  function syncPkgs(){
    if (curType() === 'task'){ $('#pkgChips').innerHTML = ''; return; }
    const list = data.packages.filter(p => p.type === curType());
    $('#pkgChips').innerHTML = list.map(p => `<button type="button" class="chip" data-pkg="${p.id}">${esc(p.name)} · ${shortRub(p.price).replace(' тыс','к')}</button>`).join('')
      || (data.packages.length ? '' : `<button type="button" class="chip ghost" data-act="pkgs">+ Заполнить прайс-лист</button>`);
  }
  $('#pkgChips').addEventListener('click', ev => {
    const b = ev.target.closest('[data-pkg]'); if (!b) return;
    const p = data.packages.find(x => x.id === b.dataset.pkg); if (!p) return;
    const ti = $('#f-title'); if (!ti.value.trim() || data.packages.some(x => x.name === ti.value.trim())) ti.value = p.name;
    if (p.price) $('#f-amount').value = p.price;
    if (p.dur) $('#f-dur').value = p.dur;
    form.querySelectorAll('[data-pkg]').forEach(x => x.classList.toggle('on', x === b));
    syncSun();
  });
  // золотой час и погода под датой
  function syncSun(){ $('#sunInfo').innerHTML = curType() === 'retouch' || curType() === 'task' ? '' : sunAdvice($('#f-date').value, $('#f-time').value, +$('#f-dur').value || 60, curType()); }
  $('#sunInfo').addEventListener('refresh', syncSun);
  $('#sunInfo').addEventListener('click', ev => {
    const b = ev.target.closest('[data-act="apply-time"]'); if (!b) return;
    ev.stopPropagation(); setTime('f-time', b.dataset.t); syncSun(); toast('Время перенесено на ' + b.dataset.t);
  });
  ['f-date','f-time','f-dur'].forEach(id => $('#' + id).addEventListener('input', syncSun));
  syncPkgs(); syncSun(); loadWeather();
  function syncSubs(){
    const box = $('#subBox'), sel = $('#f-sub');
    const name = $('#f-client').value.trim().toLowerCase();
    const c = data.clients.find(x => x.name.toLowerCase() === name);
    const opts = curType() === 'lesson' && c ? data.subs.filter(s => s.clientId === c.id && (subLeft(s) > 0 || s.id === e.subId)) : [];
    const prev = sel.value || (isNew ? (opts.find(s => subLeft(s) > 0) || {}).id : e.subId) || '';
    box.hidden = !opts.length;
    sel.innerHTML = `<option value="">Без абонемента</option>` + opts.map(s => {
      const left = subLeft(s) + (s.id === e.subId ? 1 : 0);
      return `<option value="${s.id}">${left} из ${s.total} · ${esc(subTitle(s))}</option>`;
    }).join('');
    sel.value = opts.some(s => s.id === prev) ? prev : '';
    $('#payBox').hidden = !!sel.value || curType() === 'task';
  }
  form.addEventListener('change', ev => {
    if (ev.target.id === 'f-sub'){ $('#payBox').hidden = !!ev.target.value; return; }
    if (ev.target.name !== 'f-type') return;
    const t = ev.target.value;
    $('#formatSeg').hidden = t !== 'lesson';
    $('#l-time').textContent = t === 'retouch' ? 'Сдать к' : 'Время';
    $('#durField').hidden = t === 'retouch';
    $('#repeatBox').hidden = t !== 'task';
    $('#doneBox').hidden = !(t === 'retouch' || t === 'task');
    syncRepeat();
    $('#l-done').textContent = t === 'task' ? 'Сделано' : prof().post.done;
    if (!$('#f-emoji').value) $('#iconCur').innerHTML = iconFor({type:t, format:'meet'});
    $('#l-date').textContent = t === 'retouch' ? 'Сдать до' : 'Дата';
    $('#l-client').textContent = t === 'lesson' ? prof().student : 'Клиент';
    $('#clientField').hidden = t === 'task';
    $('#f-note').placeholder = t === 'task' ? 'С кем, что взять с собой…' : ph('note');
    $('#f-title').placeholder = TYPES[t].ph;
    syncSubs(); syncPkgs(); syncSun();
  });
  $('#f-client').addEventListener('input', syncSubs);
  syncSubs();
  form.addEventListener('submit', ev => {
    ev.preventDefault();
    const fd = new FormData(form);
    const type = fd.get('f-type');
    const subId = type === 'lesson' ? fd.get('sub') || '' : '';
    // у «дела» нет денег и клиента
    const amount = subId || type === 'task' ? 0 : parseAmount(fd.get('amount'));
    const prepaidRaw = subId ? 0 : parseAmount(fd.get('prepaid')), prepaid = Math.min(prepaidRaw, amount);
    if (prepaidRaw > 0 && !amount && type !== 'task'){ toast('Укажи сумму — без неё задаток не сохранится'); $('#f-amount') && $('#f-amount').focus(); return; }
    const cid = type === 'task' ? '' : ensureClient(fd.get('client'));
    const rec = {
      id: e.id || uid(), type,
      title: fd.get('title').trim(), clientId: cid, client: type === 'task' ? '' : (fd.get('client') || '').trim(), place: (fd.get('place') || '').trim(),
      date: fd.get('date') || defaultDate(), time: fd.get('time') || '',
      prio: +fd.get('prio') || 0, emoji: fd.get('emoji') || '',
      dur: type === 'retouch' ? undefined : +fd.get('dur') || 60,
      format: type === 'lesson' ? fd.get('f-format') : undefined,
      subId: subId || undefined,
      amount, prepaid, paid: !!fd.get('paid') || (amount > 0 && prepaid >= amount),
      done: type === 'retouch' || (type === 'task' && !fd.get('repeat')) ? !!fd.get('done') : undefined,
      repeat: type === 'task' && fd.get('repeat') ? {f: fd.get('repeat'), until: fd.get('until') || '', ...(fd.get('repeat') === 'hours' ? {step: +fd.get('step') || 3, to: fd.get('repto') || '21:00'} : {})} : undefined,
      doneOn: type === 'task' && fd.get('repeat') ? e.doneOn : undefined,
      skip: type === 'task' && fd.get('repeat') ? e.skip : undefined,
      note: fd.get('note').trim(), created: e.created || Date.now(), u: Date.now()
    };
    stampPay(rec, isNew ? {} : e);
    // накладка по времени: предупреждаем один раз, второе нажатие «Сохранить» — сохраняем как есть
    const clash = rec.time && rec.type !== 'retouch' && expandEntries(rec.date, rec.date).find(x => x.id !== rec.id && x.time && x.type !== 'retouch' &&
      toMin(x.time) < toMin(rec.time) + (rec.dur || 60) && toMin(rec.time) < toMin(x.time) + durOf(x));
    const clashKey = clash ? clash.id + rec.date + rec.time + rec.dur : '';
    if (clash && form.dataset.clash !== clashKey){
      form.dataset.clash = clashKey;
      const w = $('#clashWarn'); w.hidden = false;
      w.textContent = `⚠️ На это время уже есть «${clash.title || TYPES[clash.type].one}» (${clash.time}). Нажми «${isNew ? 'Добавить' : 'Сохранить'}» ещё раз, если всё верно.`;
      w.scrollIntoView({block:'center', behavior:'smooth'});
      return;
    }
    if (isNew) data.entries.push(rec); else data.entries[data.entries.findIndex(x => x.id === e.id)] = rec;
    persist();
    const back = occ && isRepeat(rec) ? occ.slice(0, 10) : rec.date; // правили повтор — остаёмся на его дне
    ui.month = back.slice(0,7); ui.selDate = back;
    closeSheet(); render();
    const sub = subId && subById(subId);
    // если выскочит поздравление — тост не нужен, иначе их двое сразу
    const cel = checkAch({month: ui.month, subDone: sub && subLeft(sub) === 0 ? sub : null});
    if (!cel) toast(prepaidRaw > amount && amount ? `Задаток больше суммы — ${g('записал[а|]')} как полную оплату` : isNew ? cheer(rec, sub) : 'Сохранено');
  });
}

function cheer(rec, sub){
  if (sub){ const left = subLeft(sub); return left > 0 ? `Занятие записано, осталось ${left}` : 'Последнее занятие абонемента'; }
  if (rec.type === 'task') return 'Дело в календаре ✨';
  if (rec.amount >= 20000) return 'Отличный заказ! 🔥';
  return g(['Добавлено ✨','Записано ✨','Готово, ты [умница|молодец]','Добавлено, так держать'][Math.floor(Math.random()*4)]);
}

// «+»: три раздела — заработок, личное (без денег), учёт; внутри — варианты.

const LIFE_PRESETS = [['☕️','Встреча с друзьями'],['🏋️','Спорт'],['🩺','Врач'],['🛒','Покупки'],['🏠','Дела по дому'],['🎂','День рождения']];
function addItems(sec){
  const it = (key, act, attrs, color, icon, t1, t2) => ({key, act, attrs, color, icon, t1, t2});
  const student = prof().student === 'Ученица' ? 'ученицей' : 'учеником';
  const own = ((data.settings.addOwn || {})[sec] || []).map((o, i) => it('own' + i, 'new-entry',
    `data-type="${sec === 'life' ? 'task' : 'shoot'}" data-title="${esc(o.t)}" data-emoji="${esc(o.e)}"`, sec === 'life' ? 'var(--green)' : TYPES.shoot.color,
    `<span class="emo">${esc(o.e || '⭐️')}</span>`, esc(o.t), sec === 'life' ? 'Своё дело' : 'Своя запись — с суммой'));
  if (sec === 'work') return [
    it('shoot', 'new-entry', 'data-type="shoot"', TYPES.shoot.color, ICONS.shoot, TYPES.shoot.one, 'Дата, время, сумма и предоплата'),
    ...(postOn() ? [it('retouch', 'new-entry', 'data-type="retouch"', TYPES.retouch.color, ICONS.retouch, TYPES.retouch.one, prof().post.sub)] : []),
    it('lesson', 'new-entry', 'data-type="lesson"', TYPES.lesson.color, ICONS.lesson, 'Встреча или созвон с ' + student, 'Можно списать с абонемента'),
    it('other', 'new-entry', 'data-type="other"', TYPES.other.color, ICONS.other, 'Другой доход', prof().types.other.ph), ...own];
  if (sec === 'life') return [
    it('task', 'new-entry', 'data-type="task"', TYPES.task.color, ICONS.task, 'Дело', 'Своё название, время занято — без денег'),
    ...LIFE_PRESETS.map(([em, t]) => it('p:' + t, 'new-entry', `data-type="task" data-title="${t}" data-emoji="${em}"`, 'var(--green)', `<span class="emo">${em}</span>`, t, 'Дело без денег')), ...own];
  return [
    it('client', 'new-client', '', 'var(--green)', ICONS.client, 'Клиент', 'Имя, телефон, Instagram'),
    it('sub', 'new-sub', '', 'var(--indigo)', ICONS.sub, 'Абонемент', 'Пакет занятий для ' + (prof().student === 'Ученица' ? 'ученицы' : 'ученика')),
    it('exp', 'add-exp', '', 'var(--gray)', ICONS.expense, 'Расход', ph('expSub'))];
}
function addChooser(sec){

function saveSession(j){
  session = {access_token:j.access_token, refresh_token:j.refresh_token, expires_at:Date.now() + (j.expires_in||3600)*1000, email:j.user && j.user.email, uid:j.user && j.user.id};

async function authReq(path, body){

  const j = await r.json().catch(() => ({}));

async function accessToken(){
  if (!session) return null;
  if (Date.now() > session.expires_at - 60000){
    // одно обновление на всех: параллельные запросы ждут его, а не тратят токен повторно
    if (!accessToken.pending) accessToken.pending = refreshSession().finally(() => { accessToken.pending = null; });
    const ok = await accessToken.pending;
    if (!ok) return null;
  }
  return session && session.access_token;
}
async function refreshSession(){
  const used = session.refresh_token;
  try { saveSession(await authReq('token?grant_type=refresh_token', {refresh_token:used})); return true; }
  catch(e){
