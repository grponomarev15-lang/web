    try {
      const stored = JSON.parse(localStorage.getItem('kadr.session'));
      if (stored && stored.refresh_token && stored.refresh_token !== used){ session = stored; return Date.now() < stored.expires_at - 60000 || refreshSession(); }
    } catch(_) {}
    // выходим из аккаунта, только если сервер точно сказал «вход больше недействителен».
    // Сеть, сбой сервера, «уже использован» — просто ждём следующей попытки; данные на телефоне не трогаем.
    const dead = e && ['refresh_token_not_found', 'session_not_found', 'user_not_found', 'session_expired', 'validation_failed'].includes(e.code);
    if (dead){ dropSession(); sync.state = 'signedout'; toast('Вход истёк — войди снова в ⚙️ → Облако. Данные на телефоне на месте'); }

async function rest(method, path, body, prefer){

  if (!r.ok) throw {status:r.status, msg: await r.text()};

}

const COLS = ['entries','expenses','clients','subs','packages','templates'];
function merge(a, b){
  const out = {...a};
  const del = {...(a.deleted||{})};
  for (const [k,v] of Object.entries(b.deleted||{})) del[k] = Math.max(del[k]||0, v);
  const cutoff = Date.now() - 180*864e5;
  for (const k of Object.keys(del)) if (del[k] < cutoff) delete del[k];
  for (const c of COLS){
    const m = new Map();
    for (const r of [...(a[c]||[]), ...(b[c]||[])]){ const p = m.get(r.id); if (!p || (r.u||0) > (p.u||0)) m.set(r.id, r); }
    out[c] = [...m.values()].filter(r => !(del[r.id] >= (r.u||0)));
  }
  out.deleted = del;
  out.ach = {...(b.ach||{}), ...(a.ach||{})};
  if ((b.goalU||0) > (a.goalU||0)){ out.goal = b.goal; out.goalU = b.goalU; }
  if ((b.settingsU||0) > (a.settingsU||0)){ out.settings = b.settings; out.settingsU = b.settingsU; }
  if ((b.profileU||0) > (a.profileU||0)){ out.profile = b.profile; out.profileU = b.profileU; }
  out.lastBackup = Math.max(a.lastBackup||0, b.lastBackup||0) || null;
  return out;
}

function scheduleSync(){ if (!session) return; clearTimeout(sync.timer); sync.timer = setTimeout(syncNow, 1500); }
async function syncNow(){
  if (!session) return;
  // вошли, но ещё не ответили «перенести или убрать» — в облако ничего не шлём, пока не ответят
  let ask = ''; try { ask = localStorage.getItem('kadr.askLocal') || ''; } catch(e) {}
  if (ask === session.uid){ if (!sheetOpen()) askLocalData(session.uid).then(() => syncNow()); return; }
  if (sync.busy){ sync.again = true; return; }

    const remote = rows && rows[0] ? rows[0].data : null;

    if (remote && Array.isArray(remote.entries)) data = normalize(merge(data, normalize(remote)));
    // часовой пояс (для напоминаний) — уже поверх облачных настроек, чтобы не перетереть их пустыми настройками нового телефона
    const tz = Intl.DateTimeFormat().resolvedOptions().timeZone;

    setOwner(session.uid);

const b64u = s => { const p = s.replace(/-/g,'+').replace(/_/g,'/'); const bin = atob(p + '='.repeat((4 - p.length % 4) % 4)); return Uint8Array.from(bin, c => c.charCodeAt(0)); };
const pushSupported = () => 'serviceWorker' in navigator && 'PushManager' in window && 'Notification' in window;
const isStandalone = () => window.navigator.standalone || matchMedia('(display-mode: standalone)').matches;
async function pushState(){
  if (!pushSupported()) return 'unsupported';
  if (Notification.permission === 'denied') return 'denied';
  try { const reg = await navigator.serviceWorker.getRegistration(); const s = reg && await reg.pushManager.getSubscription(); return s ? 'on' : 'off'; } catch(e){ return 'off'; }
}
async function enablePush(btn){
  if (!pushSupported()){
    toast(/iPhone|iPad/.test(navigator.userAgent) && !isStandalone() ? 'Сначала добавь приложение на экран «Домой»' : 'Этот браузер не умеет уведомления');
    return;
  }
  btn.disabled = true; btn.textContent = 'Включаю…';
  try {
    const perm = await Notification.requestPermission();
    if (perm !== 'granted'){ toast('Уведомления запрещены. Разреши их в Настройках iPhone → Уведомления → Фикус'); return; }
    const reg = await navigator.serviceWorker.ready;
    const {publicKey} = await fetch(PUSH_FN + '?vapid').then(r => r.json());
    let sub = await reg.pushManager.getSubscription();
    if (!sub) sub = await reg.pushManager.subscribe({userVisibleOnly:true, applicationServerKey:b64u(publicKey)});
    await rest('POST', 'push_subs?on_conflict=endpoint', {endpoint:sub.endpoint, sub:sub.toJSON()}, 'resolution=merge-duplicates,return=minimal');
    await syncNow();
    toast('Напоминания включены 🔔');
  } catch(e){ console.warn(e); toast('Не получилось включить. Проверь интернет и попробуй ещё раз'); }
  finally { refreshCloudUi(); }
}

/* ---------- золотой час и погода ---------- */
// высота солнца над горизонтом в градусах (упрощённая формула NOAA, точность ~1 мин)
function sunElev(t, lat, lon){
  const rad = Math.PI / 180, d = t.getTime() / 864e5 + 2440587.5 - 2451545.0;
  const gm = (357.529 + 0.98560028 * d) * rad, q = 280.459 + 0.98564736 * d;
  const L = (q + 1.915 * Math.sin(gm) + 0.020 * Math.sin(2 * gm)) * rad, e = (23.439 - 0.00000036 * d) * rad;
  const ra = Math.atan2(Math.cos(e) * Math.sin(L), Math.cos(L)), dec = Math.asin(Math.sin(e) * Math.sin(L));
  const gmst = (18.697374558 + 24.06570982441908 * d) % 24, h = (gmst * 15 + lon) * rad - ra;
  return Math.asin(Math.sin(lat * rad) * Math.sin(dec) + Math.cos(lat * rad) * Math.cos(dec) * Math.cos(h)) / rad;
}
// смещение часового пояса от UTC в минутах на заданную дату
function tzOffset(tz, y, m, d){
  try {
    const t = Date.UTC(y, m-1, d, 12);
    const p = Object.fromEntries(new Intl.DateTimeFormat('en-GB', {timeZone:tz, year:'numeric', month:'2-digit', day:'2-digit', hour:'2-digit', minute:'2-digit', hourCycle:'h23'}).formatToParts(new Date(t)).map(x => [x.type, x.value]));
    return (Date.UTC(+p.year, +p.month-1, +p.day, +p.hour, +p.minute) - t) / 60000;
  } catch(e){ return null; }
}
const sunCache = {};
// время в минутах от полуночи: восход/закат и золотой час утром (mS–mE) и вечером (eS–eE)
function sunInfo(ds){
  const c = data.profile && data.profile.city; if (!c || !ds) return null;
  const key = ds + ':' + c.lat + ':' + c.lon; if (sunCache[key]) return sunCache[key];
  const [y,m,d] = ds.split('-').map(Number), el = [];
  // время считаем по часам выбранного города, а не телефона
  const off = c.tz ? tzOffset(c.tz, y, m, d) : null;
  for (let i = 0; i <= 720; i++) el.push(sunElev(off == null ? new Date(y, m-1, d, 0, i*2) : new Date(Date.UTC(y, m-1, d, 0, i*2) - off*60000), c.lat, c.lon));
  const cross = (lvl, up) => {
    for (let i = 1; i < el.length; i++){ const a = el[i-1], b = el[i]; if (up ? a < lvl && b >= lvl : a >= lvl && b < lvl) return Math.round((i-1)*2 + 2*(lvl-a)/(b-a)); }
    return null;
  };
  return sunCache[key] = {rise:cross(-0.833,true), set:cross(-0.833,false), mS:cross(-4,true), mE:cross(6,true), eS:cross(6,false), eE:cross(-4,false)};
}
let wx = null; try { wx = JSON.parse(localStorage.getItem('kadr.wx')); } catch(e) {}
let wxLoading = false;
async function loadWeather(){
  const c = data.profile && data.profile.city; if (!c || wxLoading || navigator.onLine === false) return;
  const key = c.lat.toFixed(2) + ',' + c.lon.toFixed(2);
  if (wx && wx.key === key && Date.now() - wx.at < 3*3600e3) return;
  wxLoading = true;
  try {
    const j = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${c.lat}&longitude=${c.lon}&hourly=temperature_2m,weather_code,precipitation_probability&forecast_days=16&timezone=auto`).then(r => r.json());
    if (!j.hourly) return;
    wx = {key, at:Date.now(), time:j.hourly.time, t:j.hourly.temperature_2m, c:j.hourly.weather_code, p:j.hourly.precipitation_probability};
    try { localStorage.setItem('kadr.wx', JSON.stringify(wx)); } catch(e) {}
    if (ui.tab === 'plan' && !sheetOpen()) render();
    const si = $('#sunInfo'); if (si) si.dispatchEvent(new Event('refresh'));
  } catch(e) {} finally { wxLoading = false; }
}
function weatherAt(ds, min){
  if (!wx || !wx.time) return null;
  const i = wx.time.indexOf(ds + 'T' + pad(Math.min(23, Math.floor(min/60))) + ':00');
  return i < 0 ? null : {t:Math.round(wx.t[i]), c:wx.c[i], p:wx.p[i]};
}
const WX = c => c === 0 ? ['☀️','ясно'] : c <= 2 ? ['🌤','малооблачно'] : c === 3 ? ['☁️','пасмурно'] : c <= 48 ? ['🌫','туман'] : c <= 57 ? ['🌦','морось'] : c <= 67 ? ['🌧','дождь'] : c <= 77 ? ['🌨','снег'] : c <= 82 ? ['🌧','ливень'] : c <= 86 ? ['🌨','снегопад'] : ['⛈','гроза'];
function wxText(w){ if (!w) return ''; const [ic, l] = WX(w.c); return `${ic} ${w.t > 0 ? '+' : ''}${w.t}°, ${l}${w.p >= 30 ? ', осадки ' + w.p + '%' : ''}`; }
function sunBar(ds){
  if (!prof().sun) return '';
  const s = sunInfo(ds);
  if (!s) return `<button class="sunbar glass" data-act="profile">☀️ <span>Укажи свой город — покажу золотой час и погоду</span></button>`;
  const parts = [];
  if (s.eS != null && s.eE != null) parts.push(`<span class="gh">✨ Золотой час ${hhmm(s.eS)}–${hhmm(s.eE)}</span>`);
  if (s.rise != null) parts.push(`<span>🌅 ${hhmm(s.rise)}</span>`);
  if (s.set != null) parts.push(`<span>🌇 ${hhmm(s.set)}</span>`);
  const w = weatherAt(ds, s.eS != null ? s.eS : 15*60); if (w) parts.push(`<span>${wxText(w)}</span>`);
  return `<div class="sunbar glass">${parts.join('')}</div>`;
}
// подсказка в записи: золотой час, погода и совет, когда начать
function sunAdvice(ds, time, dur, type){
  if (!prof().sun) return '';
  const s = sunInfo(ds);
  if (!s) return type === 'shoot' ? `<button type="button" class="sunline" data-act="profile">☀️ Укажи город в профиле — подскажу золотой час и погоду</button>` : '';
  const lines = [];
  if (s.eS != null && s.eE != null) lines.push(`✨ Золотой час ${hhmm(s.eS)}–${hhmm(s.eE)} · закат ${hhmm(s.set)}`);
  const w = weatherAt(ds, time ? toMin(time) : (s.eS != null ? s.eS : 15*60)); if (w) lines.push(wxText(w) + (time ? ' в ' + time : ''));
  let tip = '';
  if (type === 'shoot' && time && s.eS != null && s.eE != null){
    const a = toMin(time), b = a + dur;
    const inEve = a < s.eE && b > s.eS, inMorn = s.mS != null && a < s.mE && b > s.mS;
    if (!inEve && !inMorn && a >= 9*60){
      const start = Math.floor((s.eE - dur) / 10) * 10;
      if (start > 6*60) tip = `<button type="button" class="suntip" data-act="apply-time" data-t="${hhmm(start)}">Начни в ${hhmm(start)}, чтобы снимать в золотой час · <b>Перенести</b></button>`;
    } else if (inEve || inMorn) tip = `<span class="sunok">Попадаешь в золотой час 👌</span>`;
  }
  return lines.length ? `<div class="sunline">${lines.map(esc).join('<br>')}</div>${tip}` : '';
}

function recapStats(ym){
  const es = data.entries.filter(e => e.date && e.date.slice(0,7) === ym && e.date <= today());
  const s = stats(ym);
  const prev = allMonths().filter(x => x < ym).map(x => stats(x).incT).filter(v => v > 0);
  return {ym, income:earnedIn(ym), shoots:es.filter(e => e.type === 'shoot').length, lessons:es.filter(e => e.type === 'lesson').length,
    retouch:es.filter(e => e.type === 'retouch').length, clients:new Set(es.map(e => e.clientId).filter(Boolean)).size,
    hours:Math.round(es.filter(e => e.type !== 'retouch' && e.time).reduce((a, e) => a + durOf(e), 0) / 60),
    record:prev.length >= 1 && s.incT > Math.max(...prev), total:es.length};
}
function drawRecap(st, showMoney){
  const W = 1080, H = 1920, cv = document.createElement('canvas'); cv.width = W; cv.height = H;
  const x = cv.getContext('2d'), F = '-apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, sans-serif';
  // палитра по теме: розово-фиолетовая или графит с кислотно-зелёным

    ? {base:'#050807', g1:'rgba(70,150,20,.85)', g2:'rgba(13,110,100,.85)', g3:'rgba(182,255,60,.22)', badge:'#b6ff3c', badgeText:'#0b1405'}

  const glow = (cx, cy, r, col) => { const gr = x.createRadialGradient(cx, cy, 0, cx, cy, r); gr.addColorStop(0, col); gr.addColorStop(1, 'rgba(0,0,0,0)'); x.fillStyle = gr; x.fillRect(0, 0, W, H); };

  const [y, m] = st.ym.split('-').map(Number);
  x.fillStyle = '#fff'; x.textAlign = 'left';
  x.globalAlpha = .75; x.font = `600 40px ${F}`; x.fillText('И Т О Г И   М Е С Я Ц А', 90, 200);
  x.globalAlpha = 1; x.font = `800 160px ${F}`; x.fillText(MONTHS[m-1][0].toUpperCase() + MONTHS[m-1].slice(1), 84, 370);
  x.globalAlpha = .75; x.font = `500 56px ${F}`; x.fillText(String(y) + (myName() ? ' · ' + myName() : ''), 90, 450);
  x.globalAlpha = 1;
  const rr = (rx, ry, rw, rh, r) => { x.beginPath(); x.moveTo(rx + r, ry); x.arcTo(rx + rw, ry, rx + rw, ry + rh, r); x.arcTo(rx + rw, ry + rh, rx, ry + rh, r); x.arcTo(rx, ry + rh, rx, ry, r); x.arcTo(rx, ry, rx + rw, ry, r); x.closePath(); };
  // главная цифра
  rr(70, 540, W - 140, 400, 56); x.fillStyle = 'rgba(255,255,255,.16)'; x.fill(); x.strokeStyle = 'rgba(255,255,255,.35)'; x.lineWidth = 3; x.stroke();
  x.fillStyle = '#fff';
  let big = showMoney ? rub(st.income) : String(st.shoots), label = showMoney ? g('заработал[а|] за месяц') : plural(st.shoots, ...prof().unit.count) + ' за месяц';
  let size = 170; x.font = `800 ${size}px ${F}`; while (x.measureText(big).width > W - 240 && size > 80){ size -= 6; x.font = `800 ${size}px ${F}`; }
  x.fillText(big, 120, 760);
  x.globalAlpha = .8; x.font = `500 48px ${F}`; x.fillText(label, 124, 850); x.globalAlpha = 1;
  if (st.record){
    x.font = `700 44px ${F}`; const t = '🏆 Рекордный месяц', tw = x.measureText(t).width + 70;
    rr(70, 980, tw, 96, 48); x.fillStyle = P.badge; x.fill(); x.fillStyle = P.badgeText; x.fillText(t, 105, 1045); x.fillStyle = '#fff';
  }
  // плитки
  const tiles = [[st.shoots, plural(st.shoots, ...prof().unit.count)], [st.lessons, plural(st.lessons,'занятие','занятия','занятий')], postOn() ? [st.retouch, plural(st.retouch, ...prof().post.forms)] : [st.hours, plural(st.hours, 'час работы', 'часа работы', 'часов работы')], [st.clients, plural(st.clients,'клиент','клиента','клиентов')]];
  if (!showMoney) tiles[0] = [st.total, plural(st.total,'запись','записи','записей')];
  const tw = (W - 140 - 40) / 2, th = 250, ty = st.record ? 1120 : 1010;
  tiles.forEach(([v, l], i) => {
    const tx = 70 + (i % 2) * (tw + 40), yy = ty + Math.floor(i / 2) * (th + 40);
    rr(tx, yy, tw, th, 44); x.fillStyle = 'rgba(255,255,255,.13)'; x.fill(); x.strokeStyle = 'rgba(255,255,255,.28)'; x.lineWidth = 3; x.stroke();
    x.fillStyle = '#fff'; x.font = `800 120px ${F}`; x.fillText(String(v), tx + 44, yy + 150);
    x.globalAlpha = .8; x.font = `500 44px ${F}`; x.fillText(l, tx + 48, yy + 215); x.globalAlpha = 1;

/* ---------- шаблоны сообщений ---------- */
const TOKENS = ['{имя}','{дата}','{время}','{место}','{сумма}','{предоплата}','{остаток}'];
function fillTemplate(text, e){
  const first = (clientName(e) || '').split(' ')[0];
  const sum = +e.amount || 0, pre = Math.min(+e.prepaid || 0, sum);
  let s = g(text).replace(/\{имя\}/g, first).replace(/\{дата\}/g, e.date ? shortDate(e.date) : '').replace(/\{время\}/g, e.time || '')
    .replace(/\{место\}/g, e.place ? ', ' + e.place : '').replace(/\{сумма\}/g, rub(sum)).replace(/\{предоплата\}/g, rub(pre))
    .replace(/\{остаток\}/g, rub(e.paid ? 0 : sum - pre));
  s = s.replace(/^[,\s]+/, '').replace(/ +([,.!?])/g, '$1').replace(/ {2,}/g, ' ');
  return s.charAt(0).toUpperCase() + s.slice(1);
}
function copyText(t){
  const ok = () => toast('Скопировано — вставь в чат с клиентом');
  const fallback = () => { const ta = document.createElement('textarea'); ta.value = t; ta.setAttribute('readonly', ''); ta.style.cssText = 'position:fixed;top:0;opacity:0'; document.body.appendChild(ta); ta.select(); ta.setSelectionRange(0, t.length); let done = false; try { done = document.execCommand('copy'); } catch(e) {} ta.remove(); done ? ok() : toast('Не получилось скопировать'); };
  if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(t).then(ok, fallback); else fallback();
}

/* ---------- профиль, город, знакомство ---------- */
async function geocode(q){
  const j = await fetch('https://geocoding-api.open-meteo.com/v1/search?count=6&language=ru&format=json&name=' + encodeURIComponent(q)).then(r => r.json());
  return (j.results || []).map(r => ({name:r.name, region:[r.admin1, r.country].filter(Boolean).join(', '), lat:+r.latitude.toFixed(4), lon:+r.longitude.toFixed(4), tz:r.timezone || ''}));
}
// поле поиска города: onPick(city) вызывается при выборе
function cityPicker(root, current, onPick){
  root.innerHTML = `<div class="form" style="margin-bottom:8px"><div class="field"><label for="cp-q" style="width:auto">Город</label>
    <input id="cp-q" value="${esc(current ? current.name : '')}" placeholder="Москва" autocomplete="off" enterkeyhint="search"></div></div><div class="cp-res"></div>`;
  const q = root.querySelector('#cp-q'), res = root.querySelector('.cp-res');
  let tmr, seq = 0;
  const search = () => {
    const v = q.value.trim(); if (v.length < 2){ res.innerHTML = ''; return; }
    const my = ++seq; res.innerHTML = '<p class="hint" style="margin:4px 6px">Ищу…</p>';
    geocode(v).then(list => {
      if (my !== seq) return;
      res.innerHTML = list.length ? `<div class="list" style="background:var(--glass);border:1px solid var(--edge)">${list.map((c,i) => `<button type="button" class="row" data-i="${i}" style="min-height:52px"><div class="rt"><div class="t1">${esc(c.name)}</div><div class="t2">${esc(c.region)}</div></div></button>`).join('')}</div>` : '<p class="hint" style="margin:4px 6px">Не нашлось. Проверь написание.</p>';
      res.querySelectorAll('[data-i]').forEach(b => b.addEventListener('click', ev => { ev.stopPropagation(); const c = list[+b.dataset.i]; q.value = c.name; res.innerHTML = `<p class="hint" style="margin:4px 6px">✓ ${esc(c.name)}, ${esc(c.region)}</p>`; onPick(c); }));
    }).catch(() => { if (my === seq) res.innerHTML = '<p class="hint" style="margin:4px 6px">Нет связи. Попробуй позже.</p>'; });
  };
  q.addEventListener('input', () => { clearTimeout(tmr); tmr = setTimeout(search, 450); });
  q.addEventListener('keydown', ev => { if (ev.key === 'Enter'){ ev.preventDefault(); clearTimeout(tmr); search(); } });
}

// фото уменьшаем до 192×192 (квадрат по центру), ~15 КБ — чтобы не раздувать данные
function setAvatar(file){
  const img = new Image(), url = URL.createObjectURL(file);
  img.onload = () => {
    const n = 192, cv = document.createElement('canvas'); cv.width = cv.height = n;
    const k = Math.min(img.width, img.height), x = cv.getContext('2d');
    x.drawImage(img, (img.width - k) / 2, (img.height - k) / 2, k, k, 0, 0, n, n);
    URL.revokeObjectURL(url);
    data.settings = {...data.settings, avatar: cv.toDataURL('image/jpeg', 0.82)}; data.settingsU = Date.now(); persist();
    render(); profileSheet(); toast('Фото обновлено');
  };
  img.onerror = () => { URL.revokeObjectURL(url); toast('Не получилось открыть фото'); };
  img.src = url;
}

function onboarding(){
  const st = {step:0, name:'', gender:'f', city:null, profession:'photo', profName:'', look:{mode:'auto', c:[]}};
  const el = document.createElement('div'); el.className = 'onb'; el.setAttribute('role', 'dialog'); el.setAttribute('aria-modal', 'true');
  document.body.appendChild(el);
  const TOUR = () => {
    const p = PROFS[st.profession];
    return [
      ['plan','var(--pink)','Календарь', p.hide.includes('retouch')

    <span class="check ${st.profession === k ? 'on' : ''}">${ICONS.tick}</span></button>`;

      body = `<div class="lens big"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5.5 18.5C5.5 10.5 10.5 5.5 18.5 5.5c0 8-5 13-13 13z" fill="currentColor"/><path d="M6.5 17.5l8-8" stroke="rgba(0,0,0,.18)" stroke-width="1.4" stroke-linecap="round"/></svg></div><h2>Привет! Это ${APP.name}</h2><p>Календарь, клиенты и деньги — в одном красивом месте.</p>`;
      btn = 'Начать';
      skip = `<button class="onb-skip" data-ob="login">У меня уже есть аккаунт — войти</button>`;
    } else if (st.step === 1){
      body = `<h2>Как тебя зовут?</h2><p>Буду обращаться по имени.</p>
        <div class="form"><div class="field"><input id="ob-name" value="${esc(st.name)}" placeholder="Имя" autocomplete="off" style="text-align:left"></div></div>
        <div class="seg"><label><input type="radio" name="ob-g" value="f" ${st.gender==='f'?'checked':''}><span>Обращаться «она»</span></label><label><input type="radio" name="ob-g" value="m" ${st.gender==='m'?'checked':''}><span>Обращаться «он»</span></label></div>`;
    } else if (st.step === 2){
      body = `<h2>Чем ты занимаешься?</h2><p>Под это настроятся разделы и подсказки.</p>
        <div class="list" style="background:var(--glass);border:1px solid var(--edge)">
          ${profRow('photo', 'var(--pink)')}
          ${profRow('video', 'var(--indigo)')}
          ${profRow('beauty', 'var(--orange)')}
          ${profRow('custom', 'var(--green)')}

      body = `<h2>Оформление</h2><p>Собери фон под себя. Поменять можно в любой момент: аватарка → «Оформление».</p>${lookPickerHtml(st.look)}`;
    } else if (st.step === 4){

    } else if (st.step === 5){
      body = `<h2>Твой город</h2><p>Покажу золотой час, закат и погоду на день съёмки.</p><div id="obCity" style="text-align:left"></div>`;
      skip = `<button class="onb-skip" data-ob="skip">Пропустить</button>`;

      b.disabled = true; b.textContent = 'Регистрирую…';
      signUp(em, pw).then(() => { setOwner(session.uid); st.registered = true; st.step++; draw(); toast('Аккаунт создан ☁️'); })
        .catch(e => { b.disabled = false; b.textContent = 'Зарегистрироваться'; toast(AUTH_ERR[e && e.code] || (navigator.onLine === false ? 'Нет интернета' : 'Не получилось зарегистрироваться')); });
      return;
    }
    if (st.step === 7){ finish(); return; }
    st.step++;
    // золотой час бьюти не нужен — шаг с городом пропускаем
    if (st.step === 5 && !PROFS[st.profession].sun){ st.city = null; st.step++; }
    draw();
  });
  draw();
}

  };

  openSheet(`${head('Найдено ' + fresh.length + ' ' + plural(fresh.length,'событие','события','событий'))}

    ${multi ? `<div class="chips pk" id="impCals" style="margin:0 -16px 10px"></div>` : ''}

    <div class="imp-bar"><button class="btn primary" id="impBtn">Перенести</button></div>`);
  if (multi) $('#impCals').addEventListener('click', ev => {
    const b = ev.target.closest('[data-cal]'); if (!b) return;

    render(); scrollTo({top:0});
    toast(`Перенесено ${n} ${plural(n,'запись','записи','записей')} 🎉`);
    checkAch({month: ui.month});

  draw();
}

async function exportData(){
  // всё, кроме служебного: записи, клиенты, абонементы, расходы, прайс, шаблоны, профиль, настройки, цель
  const {deleted, lastBackup, ...all} = data;
  const json = JSON.stringify({app:'kadr', version:3, exportedAt:new Date().toISOString(), ...all}, null, 2);
  const name = `Фикус-копия-${today()}.json`;
  const file = new File([json], name, {type:'application/json'});
  const done = () => { data.lastBackup = Date.now(); persist(); toast('Копия сохранена'); closeSheet(); };
  try {
    if (navigator.canShare && navigator.canShare({files:[file]})){ await navigator.share({files:[file], title:'Копия данных «Фикус»'}); done(); return; }
  } catch(e){ if (e.name === 'AbortError') return; }
  const a = document.createElement('a'); a.href = URL.createObjectURL(file); a.download = name;
  document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1500);
  done();
}

      if (!Array.isArray(d.templates)) nd.templates = old.templates;
      // копия должна «победить» облако: её записи — свежее, остальное — удалено
      for (const c of COLS) nd[c].forEach(r => { r.u = now; });
      const keep = new Set(COLS.flatMap(c => nd[c].map(r => r.id)));
      nd.deleted = {...old.deleted}; COLS.forEach(c => old[c].forEach(r => { if (!keep.has(r.id)) nd.deleted[r.id] = now; }));
      if (!d.profile){ nd.profile = old.profile; } nd.profileU = now; nd.settingsU = now; nd.goalU = now;
      if (!d.settings) nd.settings = old.settings;
      data = nd; data.lastBackup = now;
      persist(); checkAch({silent:true}); closeSheet(); render(); toast('Данные восстановлены');
    };
  } catch(e){ toast('Это не похоже на копию «Фикуса»'); }
});

/* ---------- события ---------- */
let delArmed = null;
function armDelete(el, ask = 'Нажми ещё раз, чтобы удалить'){
  if (delArmed === el){ delArmed = null; return true; }
  delArmed = el; const txt = el.textContent; el.textContent = ask;
  setTimeout(() => { if (delArmed === el){ delArmed = null; el.textContent = txt; } }, 3000);
  return false;
}
document.addEventListener('click', ev => {
  const el = ev.target.closest('[data-act]'); if (!el) return;
  const a = el.dataset.act, id = el.dataset.id;
  switch(a){
    case 'tab': ui.tab = el.dataset.tab; try{localStorage.setItem('kadr.tab', ui.tab)}catch(e){} render(); scrollTo({top:0, behavior:'smooth'}); break;
    case 'month': ui.month = addMonth(ui.month, +el.dataset.k); render(); break;
    case 'month-today': ui.month = today().slice(0,7); render(); break;
    case 'filter': ui.filter = el.dataset.f; render(); break;
    case 'calview': ui.calView = el.value; try{localStorage.setItem('kadr.calView', ui.calView)}catch(e){} render(); break;
    case 'cal': calNav(+el.dataset.k); break;
    case 'cal-today': ui.selDate = today(); ui.month = ui.selDate.slice(0,7); render(); break;
    case 'pick-day': ui.selDate = el.dataset.d; ui.month = ui.selDate.slice(0,7); render(); break;
    case 'open-day': ui.selDate = el.dataset.d; ui.month = ui.selDate.slice(0,7); ui.calView = 'day'; render(); break;
    case 'new-on': ui.selDate = el.dataset.d; entryForm(null, {date: el.dataset.d}); break;
    case 'slot': {
      // нажатие на пустое место в дне — новая запись на это время (с шагом 30 минут)
      const r = el.getBoundingClientRect();
      const m = Math.max(0, Math.floor(((+el.dataset.h) * 60 + (ev.clientY - r.top - 10) / 56 * 60) / 30) * 30);
      entryForm(null, {date: ui.selDate, time: hhmm(Math.min(m, 23*60 + 30))});
      break;
    }
    case 'phrase': ui.phrase = (ui.phrase + 1 + Math.floor(Math.random()*(PHRASES.length-1))) % PHRASES.length; render(); break;
    case 'add': addChooser.edit = false; addChooser(); break;
    case 'new-entry': swapSheet(() => entryForm(null, {type: el.dataset.type, title: el.dataset.title, emoji: el.dataset.emoji})); break;
    case 'add-sec': addChooser(el.dataset.s); break;
    case 'add-edit': addChooser.edit = !addChooser.edit; addChooser(); break;
    case 'add-toggle': addSettings(st => { const k = addChooser.last + ':' + el.dataset.k, h = st.addHide || []; st.addHide = h.includes(k) ? h.filter(x => x !== k) : [...h, k]; }); break;
    case 'add-own-del': addSettings(st => { const o = {...(st.addOwn || {})}; o[addChooser.last] = (o[addChooser.last] || []).filter((_, i) => i !== +el.dataset.k); st.addOwn = o; }); break;
    case 'add-own-new': {
      const t = ($('#ao-t').value || '').trim(), e = ($('#ao-e').value || '').trim();
      if (!t){ toast('Напиши название'); $('#ao-t').focus(); break; }
      addSettings(st => { const o = {...(st.addOwn || {})}; o[addChooser.last] = [...(o[addChooser.last] || []), {e, t}]; st.addOwn = o; });
      toast('Добавлено в список'); break;
    }
    case 'new-for-client': swapSheet(() => entryForm(null, {clientId: id, type: clientStats(id).isStudent && !clientStats(id).shoots ? 'lesson' : 'shoot'})); break;
    case 'new-client': swapSheet(() => clientForm(null)); break;
    case 'new-sub': swapSheet(() => subForm(null, id || '')); break;
    case 'add-exp': swapSheet(() => expenseForm(null)); break;
    case 'edit': swapSheet(() => entryForm(data.entries.find(e => e.id === id), {occ: el.dataset.occ})); break;
    case 'edit-exp': expenseForm(data.expenses.find(x => x.id === id)); break;
    case 'edit-sub': swapSheet(() => subForm(subById(id))); break;
    case 'client': swapSheet(() => clientSheet(id)); break;
    case 'edit-client': swapSheet(() => clientForm(clientById(id))); break;
    // случайное нажатие на «Ждёт оплаты» легко отменить
    case 'paid': case 'paid-sub': {
      const x = a === 'paid' ? data.entries.find(y => y.id === id) : subById(id); if (!x) break;
      const flip = () => { const old = {...x}; x.paid = !x.paid; stampPay(x, old); touch(x); persist(); render(); };
      flip();
      const what = x.title || (a === 'paid-sub' ? 'Абонемент' : TYPES[x.type] ? TYPES[x.type].one : 'Запись');
      toast(x.paid ? `«${what}» — оплачено 💸` : `«${what}» — снова ждёт оплаты`, flip);
      break;
    }
    case 'done': {
      const e0 = data.entries.find(x => x.id === id); if (!e0) break;
      // у повтора своя галочка на каждый день
      const occ = el.dataset.occ;
      if (occ && isRepeat(e0)){ e0.doneOn = {...(e0.doneOn || {})}; if (e0.doneOn[occ]) delete e0.doneOn[occ]; else e0.doneOn[occ] = true; }
      else e0.done = !e0.done;
      touch(e0); persist();
      const e = occ && isRepeat(e0) ? occFrom(e0, occ) : e0;
      // в окне «Не закрыто» — обновляем список; в окне переноса («уже сделано») — закрываем
      if ($('#odList')) { overdueList().length ? overdueSheet() : closeSheet(); }
      else if (sheetOpen() && !el.closest('.row')) closeSheet();
      if (el.closest('#app .list')){ el.classList.toggle('on', !!e.done); const r = el.closest('.row'); r.style.transition = 'opacity .25s'; r.style.opacity = '.4'; setTimeout(render, 280); }
      else render();
      if (e.type === 'task'){ toast(e.done ? 'Дело сделано ✓' : 'Дело снова в планах'); break; }
      const zero = e.done && !data.entries.some(x => x.type === 'retouch' && !x.done);
      if (!zero) toast(e.done ? prof().post.done + '. Так держать!' : prof().post.back);
      checkAch({retouchZero: zero});
      break;
    }
    case 'resched': { const e = data.entries.find(x => x.id === id); swapSheet(() => reschedSheet(el.dataset.occ && isRepeat(e) ? occFrom(e, el.dataset.occ) : e)); break; }
    case 'resched-to': moveEntry(id, el.dataset.d, el.dataset.t, el.dataset.occ); break;
    case 'resched-custom': { const d = $('#rs-d').value; if (!d){ toast('Выбери дату'); break; } moveEntry(id, d, $('#rs-t').value, el.dataset.occ); break; }
    case 'del-occ': {
      if (!armDelete(el)) break;
      const e = data.entries.find(x => x.id === id); e.skip = [...(e.skip || []), el.dataset.occ]; touch(e);
      persist(); closeSheet(); render(); toast('Удалено только ' + occDay(el.dataset.occ)); break;
    }
    case 'goal': swapSheet(goalForm); break;
    case 'settings': settingsSheet(); break;
    // баннер «только на этом телефоне» — сразу к регистрации в меню
    case 'signup': settingsSheet.mode = 'up'; settingsSheet(); setTimeout(() => {
      const f = $('#loginForm'); if (!f) return;
      f.scrollIntoView({block:'center', behavior:'smooth'}); setTimeout(() => $('#l-email').focus({preventScroll:true}), 350);
    }, 450); break;
    case 'look': swapSheet(() => lookSheet()); break;
    case 'look-save': { const st = lookSheet.st; data.settings = {...data.settings, look: {mode: st.mode, c: st.c}}; data.settingsU = Date.now(); persist(); closeSheet(); toast('Оформление сохранено'); break; }
    case 'look-reset': { const st = lookSheet.st; st.mode = 'auto'; st.c = []; data.settings = {...data.settings, look: {mode:'auto', c:[]}}; data.settingsU = Date.now(); persist(); closeSheet(); toast('Вернули как было'); break; }
    case 'sw-pin': case 'sw-mute': {
      const e = data.entries.find(x => x.id === id); if (!e) break;
      const k = a === 'sw-pin' ? 'pin' : 'mute'; e[k] = !e[k]; if (!e[k]) delete e[k]; touch(e); persist(); render();
      toast(a === 'sw-pin' ? (e.pin ? 'Закреплено сверху' : 'Откреплено') : (e.mute ? 'Напоминаний не будет' : 'Напоминания включены')); break;
    }
    case 'sw-del': {
      const i = data.entries.findIndex(x => x.id === id); if (i < 0) break;
      const e = data.entries[i], occ = el.dataset.occ, before = JSON.stringify(e);
      if (occ && isRepeat(e)){ e.skip = [...(e.skip || []), occ]; touch(e); }
      else { data.entries.splice(i, 1); tomb(id); }
      persist(); render();
      toast(occ && isRepeat(e) ? 'Удалено только ' + occDay(occ) : 'Удалено', () => {
        const back = touch(JSON.parse(before)), j = data.entries.findIndex(x => x.id === id);
        if (j >= 0) data.entries[j] = back; else { data.entries.push(back); delete data.deleted[id]; }
        persist(); render();
      }); break;
    }
    case 'ava-pick': $('#ava-file').click(); break;
    case 'ava-del': data.settings = {...data.settings}; delete data.settings.avatar; data.settingsU = Date.now(); persist(); render(); profileSheet(); toast('Фото убрано'); break;
    case 'cfilter': ui.cfilter = el.value; render(); break;
    case 'exp-cats': swapSheet(expCatsSheet); break;
    case 'exp-cat-del': { const l = expCats().slice(); l.splice(+el.dataset.i, 1); setExpCats(l.length ? l : [{k:'other', l:'Другое'}]); break; }
    case 'exp-cat-add': { const v = ($('#ec-new').value || '').trim(); if (!v){ toast('Напиши название'); break; } setExpCats([...expCats(), {k: 'c' + uid(), l: v}]); break; }
    case 'exp-cats-reset': { data.settings = {...data.settings}; delete data.settings.expCats; data.settingsU = Date.now(); persist(); expCatsSheet(); toast('Вернули стандартные статьи'); break; }
    case 'exp-cats-done': swapSheet(() => expenseForm()); break;
    case 'exp-paid': {
      const x = data.expenses.find(y => y.id === id); if (!x) break;
      const flip = () => { x.paid = x.paid === false; touch(x); persist(); render(); };
      flip(); toast(x.paid ? `«${x.title || expLabel(x)}» — оплачено, вычел из дохода` : 'Снова ожидается', flip); break;
    }
    case 'prio-reset':
      openSheet(`${head('Сбросить приоритеты?')}<p class="hint" style="margin:0 6px 16px">Все отметки 🔥 ⚡ 😴 снимутся со всех записей и дел. Вернуть их можно будет только вручную, в каждой записи.</p>
        <div class="actions"><button class="btn danger" data-act="prio-reset-yes">Да, сбросить все</button><button class="btn tinted" data-act="close">Отмена</button></div>`); break;
    case 'prio-reset-yes': data.entries.forEach(e => { if (e.prio){ e.prio = 0; touch(e); } }); persist(); closeSheet(); render(); toast('Приоритеты сброшены'); break;
    case 'open-history': closeSheet(); ui.tab = 'history'; render(); scrollTo({top:0}); break;
    case 'profile': swapSheet(profileSheet); break;
    case 'recap': swapSheet(() => recapSheet(el.dataset.m)); break;
    case 'pkgs': swapSheet(packagesSheet); break;
    case 'new-pkg': swapSheet(() => packageForm(null)); break;
    case 'edit-pkg': swapSheet(() => packageForm(data.packages.find(p => p.id === id))); break;
    case 'del-pkg': if (!armDelete(el)) break; data.packages = data.packages.filter(p => p.id !== id); tomb(id); persist(); toast('Удалено'); swapSheet(packagesSheet); break;
    case 'templates': swapSheet(templatesSheet); break;
    case 'new-tpl': swapSheet(() => templateForm(null)); break;
    case 'edit-tpl': swapSheet(() => templateForm(data.templates.find(t => t.id === id))); break;
    case 'del-tpl': if (!armDelete(el)) break; data.templates = data.templates.filter(t => t.id !== id); tomb(id); persist(); toast('Удалено'); swapSheet(templatesSheet); break;
    case 'tpl-for': swapSheet(() => templatesForEntry(data.entries.find(x => x.id === id))); break;
    case 'copy-tpl': { const t = data.templates.find(x => x.id === id), e = data.entries.find(x => x.id === el.dataset.e); if (t && e) copyText(fillTemplate(t.text, e)); break; }
    case 'feedback': swapSheet(feedbackSheet); break;
    case 'cal-import': swapSheet(() => calImportSheet(null)); break;
    case 'cal-src': swapSheet(() => calImportSheet(el.dataset.s)); break;
    case 'sync-now': syncNow().then(() => toast(sync.state === 'ok' ? 'Синхронизировано' : 'Не получилось, проверь интернет')); break;
    case 'logout': if (!armDelete(el, 'Точно выйти?')) break; el.textContent = 'Сохраняю в облако…'; logOut(); break;
    case 'logout-force': logOut(true); break;
    case 'push-on': enablePush(el); break;
    case 'push-test': testPush(); break;
    case 'export': exportData(); break;
    case 'import': $('#importFile').click(); break;
    case 'open-month': ui.month = el.dataset.m; ui.tab = 'money'; render(); scrollTo({top:0}); break;
    case 'hide-install': try{localStorage.setItem('kadr.installHidden','1')}catch(e){} render(); break;
    case 'close': closeSheet(); break;
    case 'del-entry': case 'del-exp':
      if (!armDelete(el)) break;
      if (a === 'del-entry') data.entries = data.entries.filter(e => e.id !== id); else data.expenses = data.expenses.filter(x => x.id !== id);
      tomb(id); persist(); closeSheet(); render(); toast('Удалено'); break;
    case 'del-sub':
      if (!armDelete(el)) break;
      data.subs = data.subs.filter(s => s.id !== id); tomb(id);
      data.entries.forEach(e => { if (e.subId === id){ delete e.subId; touch(e); } });
      persist(); closeSheet(); render(); toast('Абонемент удалён'); break;
    case 'del-client': {
      if (!armDelete(el)) break;
      const c = clientById(id);
      // имя остаётся в записях строкой, но карточку клиента из него больше не создаём (keepName)
      data.entries.forEach(e => { if (e.clientId === id){ e.client = c.name; e.clientId = ''; e.keepName = true; touch(e); } });
      data.clients = data.clients.filter(x => x.id !== id); tomb(id);
      persist(); closeSheet(); render(); toast('Клиент удалён, записи остались'); break;
    }
  }
});
document.addEventListener('keydown', ev => {
  if (ev.key === 'Escape' && !$('#sheet').hidden) closeSheet();
  if ((ev.key === 'Enter' || ev.key === ' ') && ev.target.matches('.row[role="button"],#splash')){ ev.preventDefault(); ev.target.click(); }
});

let toastT;
// toast(msg) — подсказка сверху; toast(msg, undo) — с кнопкой «Отменить» (5 секунд)
function toast(msg, undo, important){
  if (!important && persist.failAt && Date.now() - persist.failAt < 4000) return; // не затираем ошибку сохранения
  const t = $('#toast'); t.textContent = ''; const sp = document.createElement('span'); sp.className = 'tt'; sp.textContent = msg; t.appendChild(sp); t.classList.toggle('undo', !!undo); t.classList.add('show');
  if (undo){
    const b = document.createElement('button'); b.className = 'toast-undo'; b.textContent = 'Отменить';
    b.onclick = ev => { ev.stopPropagation(); clearTimeout(toastT); t.classList.remove('show'); undo(); };
    t.appendChild(b);
  }
  clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('show'), undo ? 7000 : important ? 6000 : 2200);
}

/* ---------- заставка с фразой ---------- */
function showSplash(){
  const s = $('#splash');
  $('#splashText').textContent = phrase(Math.floor(Math.random()*PHRASES.length));
  $('#splashSign').textContent = APP.name + ' · ' + APP.tagline;
  s.hidden = false; s.classList.remove('hide');
  s.querySelectorAll('.lens,p,small').forEach(n => { n.style.animation = 'none'; n.offsetHeight; n.style.animation = ''; });
  clearTimeout(showSplash.t); showSplash.t = setTimeout(hideSplash, 2800);
}
function hideSplash(){ const s = $('#splash'); s.classList.add('hide'); setTimeout(() => { s.hidden = true; }, 600); }
$('#splash').addEventListener('click', ev => { ev.stopPropagation(); hideSplash(); });
let hiddenAt = 0;
document.addEventListener('visibilitychange', () => {
  if (document.hidden) hiddenAt = Date.now();
  else {
    if (hiddenAt && Date.now() - hiddenAt > 30*60*1000){ showSplash(); render(); setTimeout(askOverdue, 3300); }
    syncNow();
  }
});
window.addEventListener('resize', () => { if (ui.tab === 'history') drawChart(); });

applyTheme(data.profile && data.profile.gender);
render();
// первый запуск — знакомство вместо заставки
if (!data.profile){ $('#splash').hidden = true; onboarding(); } else { showSplash(); setTimeout(askOverdue, 3300); }
syncNow();
if ('serviceWorker' in navigator && location.protocol.startsWith('http')) navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
